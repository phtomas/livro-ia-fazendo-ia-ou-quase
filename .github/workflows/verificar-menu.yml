name: Verificar menu do portal
on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "scripts/verificar_navegacao.py"
      - "scripts/verificar_legibilidade.py"
      - "styles.css"
      - ".github/workflows/verificar-menu.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "scripts/verificar_navegacao.py"
      - "scripts/verificar_legibilidade.py"
      - "styles.css"
      - ".github/workflows/verificar-menu.yml"
permissions:
  contents: read
jobs:
  links-e-abas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Navegacao consistente em todas as paginas
        run: python scripts/verificar_navegacao.py
      - name: Contraste WCAG e legibilidade das chamadas
        run: python scripts/verificar_legibilidade.py

name: Testes da oficina — Python

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Testar ferramentas e contratos
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar o projeto
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências dos testes editoriais
        run: python -m pip install 'PyMuPDF>=1.24,<2' 'python-docx>=1.1,<2'
      - name: Conferir numeração e boxes
        run: |
          python scripts/verificar_estrutura.py
          python scripts/verificar_boxes.py
      - name: Executar testes unitários
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensaio sintético de tokens e custos
        run: |
          python tools/observabilidade/resumir_execucoes.py \
            --runs examples/metricas/execucoes_sinteticas.jsonl \
            --rates examples/metricas/tarifas_ficticias.json \
            --output dist/metricas-ci.json
      - name: Auditar fontes Quarto (escopo limitado)
        run: |
          python tools/editorial/auditar_fontes_quarto.py . --output dist/qa-fontes-ci.json
      - name: Reproduzir jogo com teste positivo e falha esperada
        run: |
          python tools/jogos/replay_minijogo.py examples/jogos/cenario_vitoria.json --output dist/jogo-pass-ci.json
          set +e
          python tools/jogos/replay_minijogo.py examples/jogos/cenario_regressao.json --output dist/jogo-fail-ci.json
          codigo=$?
          set -e
          if [ "$codigo" -ne 2 ]; then
            echo "FAIL: roteiro negativo deveria retornar 2, retornou $codigo"
            exit 1
          fi
          echo "PASS: roteiro negativo produziu FAIL_REPLAY esperado"

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1070" viewBox="0 0 1500 1070" role="img" aria-labelledby="title description"><title id="title">Nove fórmulas que explicam redes neurais</title><desc id="description">Guia visual em nove quadros: neurônio, função de ativação, camada, função de perda, retropropagação, atualização de parâmetros, regularização, softmax e fluxo de treinamento.</desc><rect x="0" y="0" width="1500" height="1070" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.8"/><rect width="1500" height="12" fill="#146e96"/><text x="50" y="74" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="50" fill="#142c47" font-weight="800">REDES NEURAIS, SEM MISTÉRIO</text><text x="50" y="117" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#567086" font-weight="500">Nove ideias para compreender o treinamento — da entrada até o ajuste dos pesos</text><rect x="50" y="156" width="446" height="270" rx="19" fill="#fff" stroke="#2475ba" stroke-width="1.8"/><path d="M69 156 H477 Q496 156 496 175 V231 H50 V175 Q50 156 69 156" fill="#e8f3fc"/><circle cx="90" cy="198" r="25" fill="#2475ba"/><text x="90" y="206" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">1</text><text x="130" y="198" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#2475ba" font-weight="800">Neurônio</text><text x="75" y="262" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">Soma, viés e ativação</text><rect x="72" y="291" width="402" height="62" rx="12" fill="#e8f3fc" stroke="#e8f3fc" stroke-width="1.8"/><text x="273" y="329" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#223e55" font-weight="700">z = Σ(wᵢ · xᵢ) + b</text><text x="75" y="392" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">Entradas viram uma saída.</text><rect x="528" y="156" width="446" height="270" rx="19" fill="#fff" stroke="#0f8b76" stroke-width="1.8"/><path d="M547 156 H955 Q974 156 974 175 V231 H528 V175 Q528 156 547 156" fill="#e4f8f3"/><circle cx="568" cy="198" r="25" fill="#0f8b76"/><text x="568" y="206" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">2</text><text x="608" y="198" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#0f8b76" font-weight="800">Ativação</text><text x="553" y="262" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">ReLU, sigmoide e tanh</text><rect x="550" y="291" width="402" height="62" rx="12" fill="#e4f8f3" stroke="#e4f8f3" stroke-width="1.8"/><text x="751" y="329" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#223e55" font-weight="700">ReLU(z) = max(0,z)</text><text x="553" y="392" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">Cria comportamento não linear.</text><rect x="1006" y="156" width="446" height="270" rx="19" fill="#fff" stroke="#8052bd" stroke-width="1.8"/><path d="M1025 156 H1433 Q1452 156 1452 175 V231 H1006 V175 Q1006 156 1025 156" fill="#f1eafa"/><circle cx="1046" cy="198" r="25" fill="#8052bd"/><text x="1046" y="206" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">3</text><text x="1086" y="198" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#8052bd" font-weight="800">Camada</text><text x="1031" y="262" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">Vários neurônios juntos</text><rect x="1028" y="291" width="402" height="62" rx="12" fill="#f1eafa" stroke="#f1eafa" stroke-width="1.8"/><text x="1229" y="329" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#223e55" font-weight="700">a = f(Wx + b)</text><text x="1031" y="392" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">A matriz produz saídas em lote.</text><rect x="50" y="447" width="446" height="270" rx="19" fill="#fff" stroke="#ca6a22" stroke-width="1.8"/><path d="M69 447 H477 Q496 447 496 466 V522 H50 V466 Q50 447 69 447" fill="#fff1e5"/><circle cx="90" cy="489" r="25" fill="#ca6a22"/><text x="90" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">4</text><text x="130" y="489" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#ca6a22" font-weight="800">Função de perda</text><text x="75" y="553" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">Quanto a previsão errou?</text><rect x="72" y="582" width="402" height="62" rx="12" fill="#fff1e5" stroke="#fff1e5" stroke-width="1.8"/><text x="273" y="620" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#223e55" font-weight="700">MSE = média dos erros²</text><text x="75" y="683" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">Atribui um valor ao erro.</text><rect x="528" y="447" width="446" height="270" rx="19" fill="#fff" stroke="#a84b8e" stroke-width="1.8"/><path d="M547 447 H955 Q974 447 974 466 V522 H528 V466 Q528 447 547 447" fill="#fcebf7"/><circle cx="568" cy="489" r="25" fill="#a84b8e"/><text x="568" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">5</text><text x="608" y="489" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#a84b8e" font-weight="800">Retropropagação</text><text x="553" y="553" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">Regra da cadeia</text><rect x="550" y="582" width="402" height="62" rx="12" fill="#fcebf7" stroke="#fcebf7" stroke-width="1.8"/><text x="751" y="620" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#223e55" font-weight="700">∂L/∂z = (∂L/∂a) · f′(z)</text><text x="553" y="683" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">Descobre a influência dos pesos.</text><rect x="1006" y="447" width="446" height="270" rx="19" fill="#fff" stroke="#167f99" stroke-width="1.8"/><path d="M1025 447 H1433 Q1452 447 1452 466 V522 H1006 V466 Q1006 447 1025 447" fill="#e4f6fa"/><circle cx="1046" cy="489" r="25" fill="#167f99"/><text x="1046" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">6</text><text x="1086" y="489" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#167f99" font-weight="800">Atualização</text><text x="1031" y="553" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">Gradiente descendente</text><rect x="1028" y="582" width="402" height="62" rx="12" fill="#e4f6fa" stroke="#e4f6fa" stroke-width="1.8"/><text x="1229" y="620" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#223e55" font-weight="700">w ← w − η · ∂L/∂w</text><text x="1031" y="683" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">Dá um pequeno passo nos pesos.</text><rect x="50" y="738" width="446" height="270" rx="19" fill="#fff" stroke="#568044" stroke-width="1.8"/><path d="M69 738 H477 Q496 738 496 757 V813 H50 V757 Q50 738 69 738" fill="#edf8e8"/><circle cx="90" cy="780" r="25" fill="#568044"/><text x="90" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">7</text><text x="130" y="780" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#568044" font-weight="800">Regularização</text><text x="75" y="844" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">Controlar a complexidade</text><rect x="72" y="873" width="402" height="62" rx="12" fill="#edf8e8" stroke="#edf8e8" stroke-width="1.8"/><text x="273" y="911" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#223e55" font-weight="700">Ltotal = Ldados + λ · R(w)</text><text x="75" y="974" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">Penaliza pesos indesejados.</text><rect x="528" y="738" width="446" height="270" rx="19" fill="#fff" stroke="#9d641e" stroke-width="1.8"/><path d="M547 738 H955 Q974 738 974 757 V813 H528 V757 Q528 738 547 738" fill="#fff6dc"/><circle cx="568" cy="780" r="25" fill="#9d641e"/><text x="568" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">8</text><text x="608" y="780" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#9d641e" font-weight="800">Softmax</text><text x="553" y="844" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">Escores em probabilidades</text><rect x="550" y="873" width="402" height="62" rx="12" fill="#fff6dc" stroke="#fff6dc" stroke-width="1.8"/><text x="751" y="911" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#223e55" font-weight="700">pᵢ = exp(zᵢ) / Σ exp(zⱼ)</text><text x="553" y="974" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">Probabilidades somam 100%.</text><rect x="1006" y="738" width="446" height="270" rx="19" fill="#fff" stroke="#325fb3" stroke-width="1.8"/><path d="M1025 738 H1433 Q1452 738 1452 757 V813 H1006 V757 Q1006 738 1025 738" fill="#e8efff"/><circle cx="1046" cy="780" r="25" fill="#325fb3"/><text x="1046" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#fff" font-weight="800">9</text><text x="1086" y="780" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#325fb3" font-weight="800">Treinamento</text><text x="1031" y="844" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#52697c" font-weight="500">Repetir, medir, ajustar</text><rect x="1028" y="873" width="402" height="62" rx="12" fill="#e8efff" stroke="#e8efff" stroke-width="1.8"/><text x="1229" y="911" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#223e55" font-weight="700">Prever → Erro → Gradiente → Ajuste</text><text x="1031" y="974" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#4c6479" font-weight="500">Aprender requer diversas iterações.</text><text x="750" y="1053" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#527086" font-weight="500">Em cada etapa, leia o significado dos símbolos e acompanhe um exemplo numérico completo.</text></svg>
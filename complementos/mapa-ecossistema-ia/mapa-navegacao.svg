<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1360" role="img" aria-labelledby="t d"><title id="t">Ecossistema Moderno de IA — mapa ilustrado</title><desc id="d">Dez categorias interligadas: LLMs, agentes, RAG, embeddings, MCP, segurança, observabilidade, memória, automação e bancos vetoriais. A navegação clicável fica na página HTML.</desc><defs><linearGradient id="grad" x2="1" y2="1"><stop stop-color="#5d39d3"/><stop offset="1" stop-color="#168fdf"/></linearGradient></defs><rect width="1100" height="1360" rx="26" fill="#f7f7fc"/><text x="45" y="76" font-family="Arial,sans-serif" font-weight="800" font-size="43" fill="#171b37">Ecossistema Moderno de <tspan fill="#5230c6">IA</tspan></text><text x="45" y="114" font-family="Arial,sans-serif" font-size="21" fill="#4f5970">Camadas, conexões e pontos de integração</text><rect x="44" y="148" rx="19" width="1010" height="66" fill="#e8defa"/><text x="70" y="191" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#43219b">Não é uma lista de compras. É um sistema de dependências.</text><rect x="431" y="585" width="236" height="168" rx="33" fill="url(#grad)"/><text x="550" y="684" font-family="Arial,sans-serif" font-weight="800" font-size="82" fill="white" text-anchor="middle">IA</text><text x="550" y="726" font-size="19" font-family="Arial,sans-serif" fill="white" text-anchor="middle">integração</text><rect x="42" y="245" width="354" height="161" rx="24" fill="white" stroke="#3058d6" stroke-width="2"/><rect x="55" y="258" width="328" height="48" rx="17" fill="#3058d6"/><text x="66" y="289" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">LLMs e modelos</text><text x="65" y="337" font-size="19" font-family="Arial,sans-serif" fill="#263247">Fundamentos, arquitetura e inf</text><text x="65" y="369" font-size="17" font-family="Arial,sans-serif" fill="#3058d6">8 recursos no portal</text><path d="M 396 326 L 427 326" fill="none" stroke="#3058d6" stroke-width="3" opacity=".65"/><rect x="42" y="435" width="354" height="161" rx="24" fill="white" stroke="#ba2679" stroke-width="2"/><rect x="55" y="448" width="328" height="48" rx="17" fill="#ba2679"/><text x="66" y="479" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">Agentes e orquestração</text><text x="65" y="527" font-size="19" font-family="Arial,sans-serif" fill="#263247">Ferramentas, decisões e fluxos</text><text x="65" y="559" font-size="17" font-family="Arial,sans-serif" fill="#ba2679">8 recursos no portal</text><path d="M 396 516 L 427 516" fill="none" stroke="#ba2679" stroke-width="3" opacity=".65"/><rect x="42" y="625" width="354" height="161" rx="24" fill="white" stroke="#087f91" stroke-width="2"/><rect x="55" y="638" width="328" height="48" rx="17" fill="#087f91"/><text x="66" y="669" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">RAG e conhecimento</text><text x="65" y="717" font-size="19" font-family="Arial,sans-serif" fill="#263247">Indexação, busca e evidência</text><text x="65" y="749" font-size="17" font-family="Arial,sans-serif" fill="#087f91">7 recursos no portal</text><path d="M 396 706 L 427 706" fill="none" stroke="#087f91" stroke-width="3" opacity=".65"/><rect x="42" y="815" width="354" height="161" rx="24" fill="white" stroke="#7936bd" stroke-width="2"/><rect x="55" y="828" width="328" height="48" rx="17" fill="#7936bd"/><text x="66" y="859" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">Embeddings</text><text x="65" y="907" font-size="19" font-family="Arial,sans-serif" fill="#263247">Representações e similaridade</text><text x="65" y="939" font-size="17" font-family="Arial,sans-serif" fill="#7936bd">5 recursos no portal</text><path d="M 396 896 L 427 896" fill="none" stroke="#7936bd" stroke-width="3" opacity=".65"/><rect x="42" y="1005" width="354" height="161" rx="24" fill="white" stroke="#e98518" stroke-width="2"/><rect x="55" y="1018" width="328" height="48" rx="17" fill="#e98518"/><text x="66" y="1049" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">MCP e ferramentas</text><text x="65" y="1097" font-size="19" font-family="Arial,sans-serif" fill="#263247">Conectores, permissões, chamad</text><text x="65" y="1129" font-size="17" font-family="Arial,sans-serif" fill="#e98518">6 recursos no portal</text><path d="M 396 1086 L 427 1086" fill="none" stroke="#e98518" stroke-width="3" opacity=".65"/><rect x="703" y="245" width="354" height="161" rx="24" fill="white" stroke="#da4662" stroke-width="2"/><rect x="716" y="258" width="328" height="48" rx="17" fill="#da4662"/><text x="727" y="289" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">Segurança e governança</text><text x="726" y="337" font-size="19" font-family="Arial,sans-serif" fill="#263247">Proteção, revisão e limites</text><text x="726" y="369" font-size="17" font-family="Arial,sans-serif" fill="#da4662">6 recursos no portal</text><path d="M 703 326 L 673 326" fill="none" stroke="#da4662" stroke-width="3" opacity=".65"/><rect x="703" y="435" width="354" height="161" rx="24" fill="white" stroke="#2c69cb" stroke-width="2"/><rect x="716" y="448" width="328" height="48" rx="17" fill="#2c69cb"/><text x="727" y="479" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="white">Observabilidade e avaliação</text><text x="726" y="527" font-size="19" font-family="Arial,sans-serif" fill="#263247">Métricas, regressões e custos</text><text x="726" y="559" font-size="17" font-family="Arial,sans-serif" fill="#2c69cb">6 recursos no portal</text><path d="M 703 516 L 673 516" fill="none" stroke="#2c69cb" stroke-width="3" opacity=".65"/><rect x="703" y="625" width="354" height="161" rx="24" fill="white" stroke="#299554" stroke-width="2"/><rect x="716" y="638" width="328" height="48" rx="17" fill="#299554"/><text x="727" y="669" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">Memória e estado</text><text x="726" y="717" font-size="19" font-family="Arial,sans-serif" fill="#263247">Persistência, histórico, conte</text><text x="726" y="749" font-size="17" font-family="Arial,sans-serif" fill="#299554">5 recursos no portal</text><path d="M 703 706 L 673 706" fill="none" stroke="#299554" stroke-width="3" opacity=".65"/><rect x="703" y="815" width="354" height="161" rx="24" fill="white" stroke="#8044bb" stroke-width="2"/><rect x="716" y="828" width="328" height="48" rx="17" fill="#8044bb"/><text x="727" y="859" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">Automação e pipelines</text><text x="726" y="907" font-size="19" font-family="Arial,sans-serif" fill="#263247">Rotinas e integração entre ser</text><text x="726" y="939" font-size="17" font-family="Arial,sans-serif" fill="#8044bb">6 recursos no portal</text><path d="M 703 896 L 673 896" fill="none" stroke="#8044bb" stroke-width="3" opacity=".65"/><rect x="703" y="1005" width="354" height="161" rx="24" fill="white" stroke="#2b77c3" stroke-width="2"/><rect x="716" y="1018" width="328" height="48" rx="17" fill="#2b77c3"/><text x="727" y="1049" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="white">Bancos vetoriais</text><text x="726" y="1097" font-size="19" font-family="Arial,sans-serif" fill="#263247">Índices e buscas por similarid</text><text x="726" y="1129" font-size="17" font-family="Arial,sans-serif" fill="#2b77c3">4 recursos no portal</text><path d="M 703 1086 L 673 1086" fill="none" stroke="#2b77c3" stroke-width="3" opacity=".65"/><rect x="42" y="1227" rx="20" width="1015" height="93" fill="#e8defa"/><text x="63" y="1263" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#42259d">Onde os sistemas falham: nas transferências entre componentes.</text><text x="63" y="1296" font-family="Arial,sans-serif" font-size="20" fill="#344158">Modelo → Recuperação → Contexto → Agente → Ferramenta → Avaliação</text></svg>
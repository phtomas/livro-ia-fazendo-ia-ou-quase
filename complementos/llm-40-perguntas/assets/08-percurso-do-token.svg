<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="955" viewBox="0 0 1440 955" role="img" aria-labelledby="ttl desc">
<title id="ttl">Como um LLM decodificador gera uma resposta, do texto ao próximo token</title><desc id="desc">Fluxograma do texto de entrada para tokenização, embeddings com posições, camadas do Transformer, probabilidades e seleção do próximo token. Explica atenção causal e distingue processamento do prompt, chamado prefill, de geração de tokens, chamada decode. A janela de contexto é limite, não etapa de processamento.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#286C9C"/></marker></defs>
<rect width="1440" height="955" fill="#F9FCFF"/>
<rect width="1440" height="11" fill="#235A96"/>
<text x="44" y="72" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="46" text-anchor="start" fill="#133151">COMO UM LLM GERA O PRÓXIMO TOKEN</text>
<text x="44" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="23" text-anchor="start" fill="#56718C">Um exemplo de modelo de linguagem autorregressivo do tipo decodificador</text>
<rect x="35" y="148" width="1370" height="251" rx="20" fill="#FFFFFF" stroke="#CFDFEC" stroke-width="2"/>
<rect x="38" y="180" width="238" height="179" rx="18" fill="#e6f4fd" stroke="#16659e" stroke-width="2"/><text x="53" y="222" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" text-anchor="start" fill="#16659e">1 · TEXTO</text><text x="53" y="269" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">Ex.: “O gato dorme”</text><text x="53" y="297" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">Prompt fornecido</text><text x="53" y="325" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">pelo usuário</text><line x1="281" y1="271" x2="294" y2="271" stroke="#286C9C" stroke-width="4" marker-end="url(#arr)"/><rect x="302" y="180" width="238" height="179" rx="18" fill="#eaf1fd" stroke="#1b5eaa" stroke-width="2"/><text x="317" y="222" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" text-anchor="start" fill="#1b5eaa">2 · TOKENIZAÇÃO</text><text x="317" y="269" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">Texto → IDs numéricos</text><text x="317" y="297" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">Os IDs dependem</text><text x="317" y="325" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">do tokenizador</text><line x1="545" y1="271" x2="558" y2="271" stroke="#286C9C" stroke-width="4" marker-end="url(#arr)"/><rect x="566" y="180" width="249" height="179" rx="18" fill="#e9f8f2" stroke="#136f5b" stroke-width="2"/><text x="581" y="222" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" text-anchor="start" fill="#136f5b">3 · EMBEDDINGS</text><text x="581" y="269" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">IDs → vetores</text><text x="581" y="297" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">numéricos aprendidos</text><text x="581" y="325" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">+ posição no modelo</text><line x1="820" y1="271" x2="833" y2="271" stroke="#286C9C" stroke-width="4" marker-end="url(#arr)"/><rect x="841" y="180" width="292" height="179" rx="18" fill="#f2eefe" stroke="#6b4eac" stroke-width="2"/><text x="856" y="222" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" text-anchor="start" fill="#6b4eac">4 · TRANSFORMER</text><text x="856" y="269" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">Camadas repetidas de</text><text x="856" y="297" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">atenção causal e</text><text x="856" y="325" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">rede feed-forward</text><line x1="1138" y1="271" x2="1151" y2="271" stroke="#286C9C" stroke-width="4" marker-end="url(#arr)"/><rect x="1159" y="180" width="243" height="179" rx="18" fill="#fff1de" stroke="#ae711f" stroke-width="2"/><text x="1174" y="222" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" text-anchor="start" fill="#ae711f">5 · PRÓXIMO TOKEN</text><text x="1174" y="269" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">Escores → probabilidades</text><text x="1174" y="297" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">Escolha do token</text><text x="1174" y="325" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="start" fill="#385269">e saída em texto</text><text x="46" y="438" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" text-anchor="start" fill="#214F7A">POR DENTRO DA ATENÇÃO CAUSAL</text><rect x="35" y="458" width="1370" height="182" rx="18" fill="#ECF5FF" stroke="#9CC4E9" stroke-width="2"/><rect x="60" y="485" width="270" height="124" rx="14" fill="#FFFFFF" stroke="#B7D2E8" stroke-width="2"/><text x="195" y="526" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="30" text-anchor="middle" fill="#215A91">Q · K · V</text><text x="195" y="563" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19" text-anchor="middle" fill="#55728B">projeções aprendidas</text><text x="195" y="587" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="17" text-anchor="middle" fill="#55728B">das representações</text><line x1="339" y1="548" x2="370" y2="548" stroke="#286C9C" stroke-width="4" marker-end="url(#arr)"/><rect x="380" y="485" width="386" height="124" rx="14" fill="#FFFFFF" stroke="#B7D2E8" stroke-width="2"/><text x="573" y="523" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" text-anchor="middle" fill="#215A91">QKᵀ / √dₖ + máscara</text><text x="573" y="561" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="middle" fill="#55728B">softmax transforma escores</text><text x="573" y="587" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="middle" fill="#55728B">em pesos de atenção</text><line x1="778" y1="548" x2="806" y2="548" stroke="#286C9C" stroke-width="4" marker-end="url(#arr)"/><rect x="816" y="485" width="558" height="124" rx="14" fill="#FFFFFF" stroke="#B7D2E8" stroke-width="2"/><text x="1095" y="523" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="24" text-anchor="middle" fill="#215A91">Pesos × V = contexto combinado</text><text x="1095" y="562" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19" text-anchor="middle" fill="#55728B">A máscara impede olhar tokens futuros.</text><text x="1095" y="588" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" text-anchor="middle" fill="#55728B">A informação de posição pode usar RoPE nas Q/K.</text><text x="46" y="682" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="27" text-anchor="start" fill="#214F7A">DOIS MOMENTOS DA INFERÊNCIA</text><rect x="35" y="701" width="656" height="143" rx="18" fill="#E9F7F2" stroke="#7CC8A7" stroke-width="2"/><text x="62" y="740" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="26" text-anchor="start" fill="#117154">PREFILL · preparar a entrada</text><text x="62" y="776" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" text-anchor="start" fill="#3B6257">Processa as posições do prompt em paralelo.</text><text x="62" y="808" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" text-anchor="start" fill="#3B6257">Pode criar o cache de chaves e valores (KV).</text><rect x="714" y="701" width="691" height="143" rx="18" fill="#FFF2E3" stroke="#E3BB76" stroke-width="2"/><text x="744" y="740" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="26" text-anchor="start" fill="#946113">DECODE · construir a resposta</text><text x="744" y="776" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" text-anchor="start" fill="#725C3A">Escolhe e incorpora um token por iteração.</text><text x="744" y="808" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" text-anchor="start" fill="#725C3A">Reaproveita o cache KV quando habilitado.</text><rect x="35" y="865" width="1370" height="64" rx="14" fill="#F0EEFB" stroke="#A7A3D8" stroke-width="2"/><text x="720" y="891" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="20" text-anchor="middle" fill="#5D548D">JANELA DE CONTEXTO = limite da sequência processável, não uma etapa depois do Transformer.</text><text x="720" y="916" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="17" text-anchor="middle" fill="#5D548D">O desenho é uma simplificação: arquiteturas e mecanismos de posição variam entre modelos.</text></svg>
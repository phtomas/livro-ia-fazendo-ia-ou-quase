<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Segurança e verificação"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2568e7"/></marker></defs><rect width="1200" height="460" fill="#ffffff"/><rect x="20" y="20" width="1160" height="420" rx="24" fill="#f8fbff" stroke="#dae5f6" stroke-width="2"/><text x="600" y="71" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="650" text-anchor="middle">Segurança e verificação</text><text x="600" y="108" fill="#4e6689" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Dados externos não devem comandar o agente</text><rect x="42" y="182" width="210" height="136" rx="20" fill="#edf3ff" stroke="#bad1fb" stroke-width="2"/><text x="147" y="222" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="650" text-anchor="middle">Fonte externa</text><text x="147" y="270" fill="#50617e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">conteúdo não confiável</text><path d="M253 248 L281 248" stroke="#2568e7" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="282" y="182" width="210" height="136" rx="20" fill="#fff3e3" stroke="#ebba7a" stroke-width="2"/><text x="387" y="222" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="650" text-anchor="middle">Fronteira</text><text x="387" y="270" fill="#50617e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">tratar como dado</text><path d="M493 248 L521 248" stroke="#2568e7" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="522" y="182" width="210" height="136" rx="20" fill="#edf3ff" stroke="#bad1fb" stroke-width="2"/><text x="627" y="222" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="650" text-anchor="middle">LLM</text><text x="627" y="270" fill="#50617e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">gerar proposta</text><path d="M733 248 L761 248" stroke="#2568e7" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="762" y="182" width="210" height="136" rx="20" fill="#e7f9f1" stroke="#a2d4c0" stroke-width="2"/><text x="867" y="222" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="650" text-anchor="middle">Validador</text><text x="867" y="270" fill="#50617e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">permissões e testes</text><path d="M973 248 L1001 248" stroke="#2568e7" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1002" y="182" width="210" height="136" rx="20" fill="#edf3ff" stroke="#bad1fb" stroke-width="2"/><text x="1107" y="222" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="650" text-anchor="middle">Ação segura</text><text x="1107" y="270" fill="#50617e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">após aprovação</text><rect x="80" y="387" width="1040" height="37" rx="17" fill="#eaf2ff"/><text x="600" y="413" fill="#1b5bba" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Injeção de prompt é risco real; controles externos e menor privilégio importam.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Inferência, streaming e métricas"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2568e7"/></marker></defs><rect width="1200" height="460" fill="#ffffff"/><rect x="20" y="20" width="1160" height="420" rx="24" fill="#f8fbff" stroke="#dae5f6" stroke-width="2"/><text x="600" y="71" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="650" text-anchor="middle">Inferência, streaming e métricas</text><text x="600" y="108" fill="#4e6689" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="middle">Observe a experiência do usuário e o custo de operação</text><rect x="42" y="181" width="210" height="127" rx="20" fill="#eaf2ff" stroke="#bad1fb" stroke-width="2"/><text x="147" y="219" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" text-anchor="middle">Pedido</text><text x="147" y="267" fill="#48648a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">tokens de entrada</text><path d="M253 247 L281 247" stroke="#2568e7" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="282" y="181" width="210" height="127" rx="20" fill="#eaf2ff" stroke="#bad1fb" stroke-width="2"/><text x="387" y="219" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" text-anchor="middle">Prefill</text><text x="387" y="267" fill="#48648a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">contexto inicial</text><path d="M493 247 L521 247" stroke="#2568e7" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="522" y="181" width="210" height="127" rx="20" fill="#eaf2ff" stroke="#bad1fb" stroke-width="2"/><text x="627" y="219" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" text-anchor="middle">Decode</text><text x="627" y="267" fill="#48648a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">tokens + cache KV</text><path d="M733 247 L761 247" stroke="#2568e7" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="762" y="181" width="210" height="127" rx="20" fill="#eaf2ff" stroke="#bad1fb" stroke-width="2"/><text x="867" y="219" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" text-anchor="middle">Streaming</text><text x="867" y="267" fill="#48648a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">resposta incremental</text><path d="M973 247 L1001 247" stroke="#2568e7" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1002" y="181" width="210" height="127" rx="20" fill="#e9f8f0" stroke="#aad7bf" stroke-width="2"/><text x="1107" y="219" fill="#0a2149" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" text-anchor="middle">Métricas</text><text x="1107" y="267" fill="#48648a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle">TTFT · ITL · custo</text><rect x="80" y="387" width="1040" height="37" rx="17" fill="#eaf2ff"/><text x="600" y="413" fill="#1b5bba" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Streaming reduz o tempo até o leitor ver texto, não necessariamente o tempo total.</text></svg>
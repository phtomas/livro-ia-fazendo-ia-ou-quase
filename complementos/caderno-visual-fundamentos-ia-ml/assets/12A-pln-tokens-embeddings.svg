<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="1754" version="1.1" viewBox="0 0 1240 1754" width="1240"><defs/><rect fill="#F5F8FC" height="1754" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0"/><rect fill="#101D3E" height="182" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0"/><rect fill="#1DAFC6" height="80" rx="13" ry="13" stroke="none" stroke-width="2" width="79" x="52" y="33"/><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="37" font-weight="700" text-anchor="middle" x="91" y="90">12</text><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="37" font-weight="700" x="160" y="77">PLN, tokens e embeddings</text><text fill="#D1D9EA" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="400" x="160" y="125">Como o texto se torna uma representação numérica</text><text fill="#A4E7DF" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="end" x="1179" y="63">A/2</text><line stroke="#DBE4F0" stroke-width="2" x1="55" x2="1185" y1="1678" y2="1678"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" x="57" y="1711">CADERNO VISUAL • IA / ML</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="end" x="1183" y="1711">Cap. 12 • Parte 1</text><rect fill="#FFFFFF" height="642" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="54" y="208"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="232"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="258">Processamento de linguagem natural</text><rect fill="#F5F8FC" height="292" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="521" x="71" y="285"/><rect fill="#FFF1C3" height="82" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="150" x="87" y="347"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="162.0" y="383.44">Texto</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="162.0" y="406.43">entrada</text><line stroke="#218AE8" stroke-width="3" x1="238" x2="248" y1="388" y2="388"/><polygon fill="#218AE8" points="248,388 237.95602165656462,392.48536498365524 237.95602165656462,383.51463501634476"/><rect fill="#EAE8FC" height="82" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="150" x="251" y="347"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="326.0" y="383.44">Modelo</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="326.0" y="406.43">PLN</text><line stroke="#218AE8" stroke-width="3" x1="402" x2="412" y1="388" y2="388"/><polygon fill="#218AE8" points="412,388 401.9560216565646,392.48536498365524 401.9560216565646,383.51463501634476"/><rect fill="#DAF6E6" height="82" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="150" x="415" y="347"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="490.0" y="383.44">Classe</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="490.0" y="406.43">ou resumo</text><circle cx="91" cy="606" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="614.0">PLN abrange classificação, extração de entidades,</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="641.2">tradução, síntese e perguntas e respostas.</text><circle cx="91" cy="672.4" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="680.4">Modelos atuais usam métodos neurais e também</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="707.6">abordagens híbridas.</text><rect fill="#FFFFFF" height="642" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="208"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="648" y="232"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="672" y="258">Tokenização</text><rect fill="#F5F8FC" height="292" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="521" x="647" y="285"/><rect fill="#FFF1C3" height="77" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="225" x="657" y="323"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="769.5" y="368.79999999999995">"Gatos brincam"</text><rect fill="#EAE8FC" height="77" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="223" x="923" y="323"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="1034.5" y="369.53">Tokens → IDs</text><line stroke="#218AE8" stroke-width="3" x1="884" x2="920" y1="362" y2="362"/><polygon fill="#218AE8" points="920,362 909.9560216565646,366.48536498365524 909.9560216565646,357.51463501634476"/><rect fill="#DAF6E6" height="71" rx="12" ry="12" stroke="none" stroke-width="2" width="439" x="683" y="433"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="902" y="459">Segmentação por vocabulário</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="902" y="485">palavras, partes ou caracteres</text><circle cx="667" cy="606" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="614.0">O tokenizador transforma texto em IDs de um</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="641.2">vocabulário.</text><circle cx="667" cy="672.4" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="680.4">Tokens não são necessariamente palavras inteiras;</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="707.6">cada modelo usa seu tokenizador.</text><rect fill="#FFFFFF" height="642" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="54" y="882"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="906"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="932">Embeddings: vetores com significado</text><rect fill="#F5F8FC" height="292" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="521" x="71" y="959"/><line stroke="#52637C" stroke-width="2" x1="135" x2="547" y1="1178" y2="1178"/><line stroke="#52637C" stroke-width="2" x1="135" x2="135" y1="1178" y2="984"/><circle cx="205" cy="1047" fill="#218AE8" r="10" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" x="218" y="1036">rei</text><circle cx="268" cy="1033" fill="#218AE8" r="10" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" x="281" y="1022">rainha</text><circle cx="381" cy="1124" fill="#EF9665" r="10" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" x="394" y="1113">cão</text><circle cx="454" cy="1097" fill="#EF9665" r="10" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" x="467" y="1086">gato</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="329" y="1221">Projeção 2D apenas ilustrativa</text><circle cx="91" cy="1280" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="1288.0">Vetores representam itens em espaços de</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="1315.2">características aprendidas.</text><circle cx="91" cy="1346.4" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="1354.4">Palavras relacionadas podem ficar próximas, mas a</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="1381.6000000000001">geometria depende do modelo e do contexto.</text><rect fill="#FFFFFF" height="642" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="882"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="648" y="906"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="672" y="932">Relação entre tokens e vetores</text><rect fill="#F5F8FC" height="292" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="521" x="647" y="959"/><rect fill="#FFF1C3" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="136" x="665" y="1008"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="733.0" y="1052.9350000000002">Tokens</text><rect fill="#EAE8FC" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="131" x="838" y="1008"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="903.5" y="1052.9350000000002">Vetores</text><rect fill="#DAF6E6" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="141" x="1009" y="1008"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="1079.5" y="1052.9350000000002">Contexto</text><line stroke="#218AE8" stroke-width="3" x1="802" x2="834" y1="1046" y2="1046"/><polygon fill="#218AE8" points="834,1046 823.9560216565646,1050.4853649836552 823.9560216565646,1041.5146350163448"/><line stroke="#218AE8" stroke-width="3" x1="970" x2="1005" y1="1046" y2="1046"/><polygon fill="#218AE8" points="1005,1046 994.9560216565646,1050.4853649836552 994.9560216565646,1041.5146350163448"/><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="738" y="1130">[23, 54, 8]</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="903" y="1130">[0,2; −0,5; …]</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1079" y="1130">dependente</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="905" y="1187">Exemplo ilustrativo, não IDs reais</text><circle cx="667" cy="1280" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="1288.0">IDs identificam unidades; embeddings produzem</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="1315.2">representações numéricas para o modelo.</text><circle cx="667" cy="1346.4" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="1354.4">Embeddings contextuais variam conforme a</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="1381.6000000000001">sequência; o gráfico 2D é apenas um exemplo.</text><rect fill="#DAF6E6" height="100" rx="14" ry="14" stroke="none" stroke-width="2" width="1129" x="55" y="1545"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" x="80" y="1585">Não confundir</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="80" y="1618">Tokenização divide/codifica sequências; embedding representa unidades ou trechos como vetores numéricos.</text></svg>
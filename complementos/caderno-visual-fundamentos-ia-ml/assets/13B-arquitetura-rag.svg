idth="1087" x="75" y="282" /><rect fill="#EAE8FC" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="245" x="95" y="329" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="217.5" y="375.395">Fontes</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="217" y="436">PDF, web, BD</text><line stroke="#218AE8" stroke-width="3" x1="341" x2="363" y1="367" y2="367" /><polygon fill="#218AE8" points="363,367 352.9560216565646,371.48536498365524 352.9560216565646,362.51463501634476" /><rect fill="#FFF1C3" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="245" x="365" y="329" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="487.5" y="375.395">Preparar</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="487" y="436">extrair / dividir</text><line stroke="#218AE8" stroke-width="3" x1="611" x2="633" y1="367" y2="367" /><polygon fill="#218AE8" points="633,367 622.9560216565646,371.48536498365524 622.9560216565646,362.51463501634476" /><rect fill="#DAF6E6" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="245" x="635" y="329" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="757.5" y="375.395">Embedding</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="757" y="436">texto → vetor</text><line stroke="#218AE8" stroke-width="3" x1="881" x2="903" y1="367" y2="367" /><polygon fill="#218AE8" points="903,367 892.9560216565646,371.48536498365524 892.9560216565646,362.51463501634476" /><rect fill="#EAE8FC" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="245" x="905" y="329" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="1027.5" y="375.395">Índice</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="1027" y="436">armazenar + metadados</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="85" y="500">Guardar origem, versão, permissões e metadados para rastreabilidade.</text><rect fill="#FFFFFF" height="339" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="1130" x="54" y="553" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="577" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="603">2 • Consulta e resposta (a cada pergunta)</text><rect fill="#F5F8FC" height="187" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="1087" x="75" y="629" /><rect fill="#FFF1C3" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="245" x="95" y="680" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="217.5" y="726.0300000000001">Pergunta</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="217" y="787">vetor da consulta</text><line stroke="#218AE8" stroke-width="3" x1="341" x2="363" y1="718" y2="718" /><polygon fill="#218AE8" points="363,718 352.9560216565646,722.4853649836552 352.9560216565646,713.5146350163448" /><rect fill="#EAE8FC" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="245" x="365" y="680" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="487.5" y="726.0300000000001">Recuperar</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="487" y="787">similar / híbrida</text><line stroke="#218AE8" stroke-width="3" x1="611" x2="633" y1="718" y2="718" /><polygon fill="#218AE8" points="633,718 622.9560216565646,722.4853649836552 622.9560216565646,713.5146350163448" /><rect fill="#DAF6E6" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="245" x="635" y="680" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="757.5" y="726.0300000000001">Contexto</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="757" y="787">trechos + fonte</text><line stroke="#218AE8" stroke-width="3" x1="881" x2="903" y1="718" y2="718" /><polygon fill="#218AE8" points="903,718 892.9560216565646,722.4853649836552 892.9560216565646,713.5146350163448" /><rect fill="#EAE8FC" height="76" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="245" x="905" y="680" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="1027.5" y="726.0300000000001">LLM</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" x="1027" y="787">gerar + citar</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="85" y="860">A busca consulta o índice da etapa 1. Use embeddings compatíveis e cite as fontes.</text><rect fill="#FFFFFF" height="563" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="361" x="54" y="909" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="933" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="959">RAG × ajuste fino</text><rect fill="#F5F8FC" height="397" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="329" x="70" y="988" /><rect fill="#DAF6E6" height="82" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="175" x="82" y="1012" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="169.5" y="1060.3000000000002">RAG</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="276" y="1044.0">Consultar fatos e</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="276" y="1068.48">documentos</text><rect fill="#EAE8FC" height="82" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="175" x="82" y="1130" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="169.5" y="1178.3000000000002">Ajuste fino</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="276" y="1162.0">Adaptar estilo,</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="276" y="1186.48">formato, tarefa</text><rect fill="#FFF1C3" height="82" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="175" x="82" y="1248" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="169.5" y="1296.3000000000002">Combinação</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="276" y="1280.0">Especializar +</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="276" y="1304.48">consultar</text><rect fill="#FFFFFF" height="563" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="362" x="438" y="909" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="456" y="933" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="480" y="959">Vetores e índices</text><rect fill="#F5F8FC" height="397" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="332" x="452" y="988" /><rect fill="#EAE8FC" height="83" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="151" x="467" y="1012" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="542.5" y="1060.07">Vetores</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="636" y="1043.0">Representações e</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="636" y="1067.48">busca</text><rect fill="#DAF6E6" height="83" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="151" x="467" y="1131" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="542.5" y="1179.07">BD vetorial</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="636" y="1162.0">Serviço com</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="636" y="1186.48">indexação e consulta</text><rect fill="#FFF1C3" height="83" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="151" x="467" y="1250" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="542.5" y="1298.07">FAISS</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="636" y="1281.0">Biblioteca de índices</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="636" y="1305.48">vetoriais</text><rect fill="#FFFFFF" height="563" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="361" x="823" y="909" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="841" y="933" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="865" y="959">Como testar RAG</text><rect fill="#F5F8FC" height="397" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="331" x="836" y="988" /><rect fill="#EAE8FC" height="83" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="153" x="848" y="1012" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="924.5" y="1060.07">Recuperação</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="1021" y="1043.0">Recall@k e relevância</text><rect fill="#DAF6E6" height="83" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="153" x="848" y="1131" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="924.5" y="1179.07">Resposta</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="1021" y="1162.0">Fidelidade às fontes</text><rect fill="#FFF1C3" height="83" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="153" x="848" y="1250" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="924.5" y="1298.07">Operação</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="1021" y="1281.0">Custo, atraso,</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="1021" y="1305.48">privacidade</text><rect fill="#FFF1C3" height="147" rx="14" ry="14" stroke="none" stroke-width="2" width="1130" x="54" y="1494" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" x="79" y="1534">RAG não elimina erros</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="79" y="1567">A geração pode inventar, distorcer ou citar mal mesmo quando o contexto foi recuperado. Qualidade depende da base,</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="79" y="1592">recuperação, prompt e avaliação.</text></svg>
ans-serif" font-size="27" font-weight="800" x="669" y="712">Naive Bayes</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="654" y="732" /><g transform="translate(658,740)"><rect fill="#F8DFEF" height="50" rx="13" ry="13" stroke="none" stroke-width="2" width="430" x="35" y="16" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="250.0" y="47.48">P(y|X) = P(X|y)·P(y) / P(X)</text><rect fill="#EAE8FC" height="65" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="155" x="2" y="102" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="79.5" y="131.275">Palavras de um</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="79.5" y="148.225">e-mail</text><line stroke="#218AE8" stroke-width="3" x1="157" x2="168" y1="135" y2="135" /><polygon fill="#218AE8" points="168,135 157.95602165656462,139.48536498365527 157.95602165656462,130.51463501634473" /><rect fill="#DAF6E6" height="65" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="155" x="171" y="102" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="248.5" y="131.275">Probabilidades por</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="248.5" y="148.225">classe</text><line stroke="#218AE8" stroke-width="3" x1="326" x2="337" y1="135" y2="135" /><polygon fill="#218AE8" points="337,135 326.9560216565646,139.48536498365527 326.9560216565646,130.51463501634473" /><rect fill="#FFF1C3" height="65" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="155" x="340" y="102" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="417.5" y="131.275">Decisão mais</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="417.5" y="148.225">provável</text></g><circle cx="662" cy="955" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="962">Usa probabilidades e hipótese de</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="988">independência condicional.</text><circle cx="662" cy="1021" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1028">Pode funcionar bem em classificação de textos.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="55" y="1116" /><rect fill="#EF9665" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="73" y="1139" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="94" y="1164">Gradient Boosting</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="79" y="1184" /><g transform="translate(83,1192)"><rect fill="#EAE8FC" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="114" x="3" y="56" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="60.0" y="99.45">Modelo 1</text><line stroke="#218AE8" stroke-width="3" x1="117" x2="127" y1="94" y2="94" /><polygon fill="#218AE8" points="127,94 116.95602165656462,98.48536498365527 116.95602165656462,89.51463501634473" /><rect fill="#EAE8FC" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="114" x="129" y="56" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-ancho
t="500" x="102" y="1028">Separar dados antes de ajustar transformações.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="664" /><rect fill="#218AE8" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="648" y="687" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="669" y="712">Ausentes e atípicos</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="654" y="732" /><g transform="translate(658,740)"><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" x="53" y="29">Valores ausentes: NULL / NaN</text><rect fill="#EAE8FC" height="53" rx="7" ry="7" stroke="none" stroke-width="2" width="175" x="45" y="47" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="130" y="80">12, 15, NaN, 19</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" x="270" y="29">Pontos atípicos</text><line stroke="#52637C" stroke-width="3" x1="265" x2="476" y1="104" y2="104" /><rect fill="#DAF6E6" height="46" rx="5" ry="5" stroke="#17A877" stroke-width="2" width="92" x="305" y="81" /><line stroke="#17A877" stroke-width="3" x1="350" x2="350" y1="81" y2="127" /><circle cx="275" cy="104" fill="#218AE8" r="5" stroke="none" stroke-width="2" /><circle cx="287" cy="104" fill="#218AE8" r="5" stroke="none" stroke-width="2" /><circle cx="409" cy="104" fill="#218AE8" r="5" stroke="none" stroke-width="2" /><circle cx="421" cy="104" fill="#218AE8" r="5" stroke="none" stroke-width="2" /><circle cx="470" cy="104" fill="#EF9665" r="7" stroke="none" stroke-width="2" /><text fill="#EF9665" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="500" x="458" y="146">outlier</text></g><circle cx="662" cy="955" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="962">Ausência pode exigir imputação; outlier exige</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="988">investigação.</text><circle cx="662" cy="1021" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1028">Não eliminar extremos só porque são raros.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="55" y="1116" /><rect fill="#EF9665" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="73" y="1139" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="94" y="1164">Escalonamento</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="79" y="1184" /><g transform="translate(83,1192)"><rect fill="#DAF6E6" height="65" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="239" x="3" y="40" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="122.5" y="78.1">Min–max: (x−mín)/(máx−mín)</text><rect fill="#EAE8FC" height="65" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="239" x="258" y="40" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="377.5" y="78.8">Z-score: (x−μ)/σ</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="600" text-anchor="middle" x="125" y="143">Intervalo [0,1]*</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="600" text-anchor="middle" x="374" y="143">Média 0; desvio 1*</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="500" text-anchor="middle" x="250" y="180">* Propriedades calculadas no conjunto de ajuste</text></g><circle cx="87" cy="1407" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="1414">Min–max traz valores para faixa configurada.</text><circle cx="87" cy="1447" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="1454">Padronização usa média μ e desvio σ do treino.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="1116" /><rect fill="#EF9665" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="648" y="1139" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="669" y="1164">Variáveis categóricas</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="654" y="1184" /><g transform="translate(658,1192)"><rect fill="#FFF1C3" height="55" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="199" x="10" y="24" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="109.5" y="57.8">Ordinal: baixo → 0</text><rect fill="#FFF1C3" height="55" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="199" x="10" y="93" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="109.5" y="126.45">médio → 1; alto → 2</text><rect fill="#DAF6E6" height="55" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="228" x="260" y="23" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="374.0" y="56.8">Sem ordem: 1-hot</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="600" x="269" y="104">RJ: 1, 0, 0</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="600" x="269" y="131">SP: 0, 1, 0</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="600" x="269" y="158">MG: 0, 0, 1</text></g><circle cx="662" cy="1407" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1414">Ordinal quando há ordem com significado.</text><circle cx="662" cy="1447" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1454">One-hot para categorias nominais; cuidado com</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1480">alta cardinalidade.</text><line stroke="#DBE4F0" stroke-width="2" x1="57" x2="1183" y1="1621" y2="1621" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="800" x="58" y="1652">CADERNO VISUAL • IA / ML</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="end" x="1183" y="1652">Edição revisada • PT-BR</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="500" x="58" y="1693">Diagramas originais recriados • Conteúdo didático e verificável</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="800" text-anchor="end" x="1183" y="1693">05</text></svg>
ext fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="510">Há dados estruturados, semiestruturados e não</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="536">estruturados.</text><circle cx="662" cy="569" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="576">PDF pode conter texto extraível, tabelas ou</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="602">imagens digitalizadas.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="55" y="664" /><rect fill="#218AE8" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="73" y="687" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="94" y="712">Fluxo de preparação</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="79" y="732" /><g transform="translate(83,740)"><rect fill="#FFF1C3" height="67" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="94" x="3" y="44" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="50.0" y="83.1">Separar</text><line stroke="#218AE8" stroke-width="3" x1="97" x2="102" y1="77" y2="77" /><polygon fill="#218AE8" points="102,77 91.95602165656462,81.48536498365527 91.95602165656462,72.51463501634473" /><rect fill="#EAE8FC" height="67" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="94" x="104" y="44" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="151.0" y="83.1">Limpar</text><line stroke="#218AE8" stroke-width="3" x1="198" x2="203" y1="77" y2="77" /><polygon fill="#218AE8" p
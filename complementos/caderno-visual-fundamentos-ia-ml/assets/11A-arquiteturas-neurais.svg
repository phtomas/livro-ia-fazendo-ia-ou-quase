<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="1754" version="1.1" viewBox="0 0 1240 1754" width="1240"><defs/><rect fill="#F5F8FC" height="1754" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0"/><rect fill="#101D3E" height="182" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0"/><rect fill="#1DAFC6" height="80" rx="13" ry="13" stroke="none" stroke-width="2" width="79" x="52" y="33"/><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="37" font-weight="700" text-anchor="middle" x="91" y="90">11</text><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="37" font-weight="700" x="160" y="77">Arquiteturas de redes neurais</text><text fill="#D1D9EA" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="400" x="160" y="125">CNN, RNN, LSTM e GRU: o que cada bloco faz</text><text fill="#A4E7DF" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="end" x="1179" y="63">A/2</text><line stroke="#DBE4F0" stroke-width="2" x1="55" x2="1185" y1="1678" y2="1678"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" x="57" y="1711">CADERNO VISUAL • IA / ML</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="end" x="1183" y="1711">Cap. 11 • Parte 1</text><rect fill="#FFFFFF" height="638" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="54" y="207"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="231"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="257">Rede convolucional (CNN)</text><rect fill="#F5F8FC" height="281" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="521" x="71" y="284"/><rect fill="#FFF1C3" height="105" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="100" x="77" y="337"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="127.0" y="396.435">Imagem</text><rect fill="#DCEBF9" height="94" rx="4" ry="4" stroke="#218AE8" stroke-width="2" width="70" x="237" y="336"/><line stroke="#B0C9E8" stroke-width="1" x1="245" x2="295" y1="357" y2="357"/><line stroke="#B0C9E8" stroke-width="1" x1="245" x2="295" y1="372" y2="372"/><line stroke="#B0C9E8" stroke-width="1" x1="245" x2="295" y1="387" y2="387"/><rect fill="#DCEBF9" height="94" rx="4" ry="4" stroke="#218AE8" stroke-width="2" width="70" x="246" y="329"/><line stroke="#B0C9E8" stroke-width="1" x1="254" x2="304" y1="357" y2="357"/><line stroke="#B0C9E8" stroke-width="1" x1="254" x2="304" y1="372" y2="372"/><line stroke="#B0C9E8" stroke-width="1" x1="254" x2="304" y1="387" y2="387"/><rect fill="#DCEBF9" height="94" rx="4" ry="4" stroke="#218AE8" stroke-width="2" width="70" x="255" y="322"/><line stroke="#B0C9E8" stroke-width="1" x1="263" x2="313" y1="357" y2="357"/><line stroke="#B0C9E8" stroke-width="1" x1="263" x2="313" y1="372" y2="372"/><line stroke="#B0C9E8" stroke-width="1" x1="263" x2="313" y1="387" y2="387"/><rect fill="#EAE8FC" height="105" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="106" x="363" y="336"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="416.0" y="384.65999999999997">Mapas de</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="416.0" y="404.02">características</text><rect fill="#DAF6E6" height="105" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="72" x="503" y="336"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="539.0" y="394.70500000000004">Classe</text><line stroke="#218AE8" stroke-width="3" x1="179" x2="232" y1="387" y2="387"/><polygon fill="#218AE8" points="232,387 221.95602165656462,391.48536498365524 221.95602165656462,382.51463501634476"/><line stroke="#218AE8" stroke-width="3" x1="314" x2="358" y1="387" y2="387"/><polygon fill="#218AE8" points="358,387 347.9560216565646,391.48536498365524 347.9560216565646,382.51463501634476"/><line stroke="#218AE8" stroke-width="3" x1="471" x2="499" y1="387" y2="387"/><polygon fill="#218AE8" points="499,387 488.9560216565646,391.48536498365524 488.9560216565646,382.51463501634476"/><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="269" y="466">Convolução</text><circle cx="91" cy="595" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="603.0">Filtros extraem padrões locais; a hierarquia pode</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="630.2">combinar bordas, formas e objetos.</text><circle cx="91" cy="661.4" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="669.4">ReLU e redução de resolução são escolhas</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="696.6">arquiteturais, não etapas obrigatórias.</text><rect fill="#FFFFFF" height="638" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="207"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="648" y="231"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="672" y="257">Rede recorrente (RNN)</text><rect fill="#F5F8FC" height="281" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="521" x="647" y="284"/><rect fill="#EAE8FC" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="105" x="728" y="367"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="780.5" y="407.29999999999995">h(t−1)</text><circle cx="780" cy="466" fill="#DAF6E6" r="19" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="780" y="473">x</text><line stroke="#17A877" stroke-width="3" x1="780" x2="780" y1="446" y2="434"/><polygon fill="#17A877" points="780,434 784.4853649836552,444.0439783434354 775.5146350163448,444.0439783434354"/><line stroke="#EF9665" stroke-width="3" x1="780" x2="780" y1="365" y2="325"/><polygon fill="#EF9665" points="780,325 784.4853649836552,335.0439783434354 775.5146350163448,335.0439783434354"/><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="780" y="316">y</text><line stroke="#8F74D6" stroke-width="3" x1="835" x2="886" y1="400" y2="400"/><polygon fill="#8F74D6" points="886,400 875.9560216565646,404.48536498365524 875.9560216565646,395.51463501634476"/><rect fill="#EAE8FC" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="105" x="888" y="367"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="940.5" y="407.29999999999995">h(t)</text><circle cx="940" cy="466" fill="#DAF6E6" r="19" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="940" y="473">x</text><line stroke="#17A877" stroke-width="3" x1="940" x2="940" y1="446" y2="434"/><polygon fill="#17A877" points="940,434 944.4853649836552,444.0439783434354 935.5146350163448,444.0439783434354"/><line stroke="#EF9665" stroke-width="3" x1="940" x2="940" y1="365" y2="325"/><polygon fill="#EF9665" points="940,325 944.4853649836552,335.0439783434354 935.5146350163448,335.0439783434354"/><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="940" y="316">y</text><line stroke="#8F74D6" stroke-width="3" x1="995" x2="1046" y1="400" y2="400"/><polygon fill="#8F74D6" points="1046,400 1035.9560216565646,404.48536498365524 1035.9560216565646,395.51463501634476"/><rect fill="#EAE8FC" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="105" x="1048" y="367"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="1100.5" y="407.29999999999995">h(t+1)</text><circle cx="1100" cy="466" fill="#DAF6E6" r="19" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="1100" y="473">x</text><line stroke="#17A877" stroke-width="3" x1="1100" x2="1100" y1="446" y2="434"/><polygon fill="#17A877" points="1100,434 1104.4853649836552,444.0439783434354 1095.5146350163448,444.0439783434354"/><line stroke="#EF9665" stroke-width="3" x1="1100" x2="1100" y1="365" y2="325"/><polygon fill="#EF9665" points="1100,325 1104.4853649836552,335.0439783434354 1095.5146350163448,335.0439783434354"/><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="1100" y="316">y</text><circle cx="667" cy="595" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="603.0">O estado h(t) recebe a entrada atual e o estado</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="630.2">anterior.</text><circle cx="667" cy="661.4" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="669.4">Pode sofrer com gradientes que desaparecem ou</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="696.6">explodem em sequências extensas.</text><rect fill="#FFFFFF" height="638" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="54" y="880"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="904"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="930">Memória de longo e curto prazo (LSTM)</text><rect fill="#F5F8FC" height="281" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="521" x="71" y="957"/><rect fill="#EAE8FC" height="49" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="226" x="215" y="977"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="328.0" y="1008.435">x(t), h(t−1)</text><line stroke="#8F74D6" stroke-width="3" x1="328" x2="328" y1="1026" y2="1051"/><line stroke="#8F74D6" stroke-width="3" x1="152" x2="504" y1="1051" y2="1051"/><line stroke="#8F74D6" stroke-width="2" x1="171" x2="171" y1="1051" y2="1066"/><polygon fill="#8F74D6" points="171,1066 166.51463501634473,1055.9560216565646 175.48536498365527,1055.9560216565646"/><rect fill="#F8DFEF" height="58" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="146" x="98" y="1069"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="171.0" y="1104.205">Porta f(t)</text><line stroke="#8F74D6" stroke-width="2" x1="330" x2="330" y1="1051" y2="1066"/><polygon fill="#8F74D6" points="330,1066 325.51463501634476,1055.9560216565646 334.48536498365524,1055.9560216565646"/><rect fill="#FFF1C3" height="58" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="146" x="257" y="1069"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="330.0" y="1104.205">Porta i(t)</text><line stroke="#8F74D6" stroke-width="2" x1="489" x2="489" y1="1051" y2="1066"/><polygon fill="#8F74D6" points="489,1066 484.51463501634476,1055.9560216565646 493.48536498365524,1055.9560216565646"/><rect fill="#DAF6E6" height="58" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="146" x="416" y="1069"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="489.0" y="1104.205">Porta o(t)</text><rect fill="#FFFFFF" height="65" rx="9" ry="9" stroke="#DBE4F0" stroke-width="2" width="432" x="113" y="1145"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="329" y="1169">c(t) = f(t)·c(t−1) + i(t)·g(t)</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="329" y="1195">h(t) = o(t)·tanh(c(t))</text><circle cx="91" cy="1268" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="1276.0">Três portas: esquecimento, entrada e saída; mantém</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="1303.2">estado da célula c(t).</text><circle cx="91" cy="1334.4" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="1342.4">Ajuda a modelar dependências longas, mas não</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="106" y="1369.6000000000001">elimina todos os limites de treino.</text><rect fill="#FFFFFF" height="638" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="880"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="648" y="904"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="672" y="930">Unidade recorrente com portas (GRU)</text><rect fill="#F5F8FC" height="281" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="521" x="647" y="957"/><rect fill="#EAE8FC" height="49" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="223" x="794" y="977"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="905.5" y="1008.435">x(t), h(t−1)</text><line stroke="#8F74D6" stroke-width="3" x1="905" x2="905" y1="1026" y2="1051"/><line stroke="#8F74D6" stroke-width="3" x1="779" x2="1028" y1="1051" y2="1051"/><line stroke="#8F74D6" stroke-width="2" x1="779" x2="779" y1="1051" y2="1070"/><polygon fill="#8F74D6" points="779,1070 774.5146350163448,1059.9560216565646 783.4853649836552,1059.9560216565646"/><line stroke="#8F74D6" stroke-width="2" x1="1028" x2="1028" y1="1051" y2="1070"/><polygon fill="#8F74D6" points="1028,1070 1023.5146350163448,1059.9560216565646 1032.4853649836552,1059.9560216565646"/><rect fill="#F8DFEF" height="59" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="185" x="686" y="1073"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="778.5" y="1109.4350000000002">Reinício r(t)</text><rect fill="#FFF1C3" height="59" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="185" x="938" y="1073"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1030.5" y="1109.07">Atualização z(t)</text><line stroke="#17A877" stroke-width="2" x1="779" x2="858" y1="1133" y2="1169"/><polygon fill="#17A877" points="858,1169 847.0003160738665,1168.9166122001664 850.7202140347374,1160.7535027860329"/><line stroke="#17A877" stroke-width="2" x1="1031" x2="949" y1="1133" y2="1169"/><polygon fill="#17A877" points="949,1169 956.3936366615071,1160.8554228521293 959.9997809575673,1169.0694181931551"/><rect fill="#DAF6E6" height="52" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="184" x="812" y="1169"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="904.0" y="1202.3000000000002">Estado h(t)</text><circle cx="667" cy="1268" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="1276.0">Duas portas usuais: atualização e reinício; não usa c(t)</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="1303.2">separado.</text><circle cx="667" cy="1334.4" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="1342.4">Menos parâmetros que uma LSTM equivalente;</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="682" y="1369.6000000000001">rapidez depende da implementação.</text><rect fill="#DAF6E6" height="100" rx="14" ry="14" stroke="none" stroke-width="2" width="1129" x="55" y="1544"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" x="80" y="1584">Comparação essencial</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="80" y="1617">CNN: estrutura espacial • RNN/LSTM/GRU: dependências sequenciais • Transformer: atenção (ver 11B).</text></svg>
<svg baseProfile="full" height="1754" version="1.1" viewBox="0 0 1240 1754" width="1240" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F5F8FC" height="1754" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0" /><rect fill="#101D3E" height="180" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0" /><rect fill="#1DAFC6" height="77" rx="16" ry="16" stroke="none" stroke-width="2" width="84" x="52" y="35" /><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="38" font-weight="800" text-anchor="middle" x="94" y="89">09</text><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="43" font-weight="800" x="157" y="88">Métricas de Avaliação</text><text fill="#C4D8EC" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="500" x="157" y="135">Escolher a medida certa para cada tipo de erro</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="55" y="212" /><rect fill="#17A877" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="73" y="235" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="94" y="260">Matriz de confusão</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="79" y="280" /><g transform="translate(83,288)"><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="800" text-anchor="middle" x="214" y="19">Previsto +</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="800" text-anchor="middle" x="383" y="19">Previsto −</text><rect fill="#DAF6E6" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="163" x="133" y="34" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="214.5" y="76.45">VP</text><rect fill="#FCE4E1" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="163" x="304" y="34" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="385.5" y="76.45">FN</text><rect fill="#FCE4E1" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="163" x="133" y="107" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="214.5" y="149.45">FP</text><rect fill="#DAF6E6" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="163" x="304" y="107" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="385.5" y="149.45">VN</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" x="26" y="72">Real +</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="700" x="26" y="145">Real −</text></g><circle cx="87" cy="503" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="510">VP/VN: acertos; FP/FN: erros de tipos</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="536">diferentes.</text><circle cx="87" cy="569" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="576">Sensibilidade ao custo de cada erro muda por</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="602">aplicação.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="212" /><rect fill="#17A877" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="648" y="235" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="24" font-weight="800" x="669" y="260">Classificação: principais medidas</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="654" y="280" /><g transform="translate(658,288)"><rect fill="#DAF6E6" height="42" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="153" x="5" y="5" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="81.5" y="31.6">Acurácia</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="600" x="180" y="34">(VP+VN) / Total</text><rect fill="#EAE8FC" height="42" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="153" x="5" y="51" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="81.5" y="77.6">Precisão</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="600" x="180" y="80">VP / (VP+FP)</text><rect fill="#DAF6E6" height="42" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="153" x="5" y="97" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="81.5" y="123.6">Revocação</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="600" x="180" y="126">VP / (VP+FN)</text><rect fill="#EAE8FC" height="42" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="153" x="5" y="143" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="81.5" y="169.6">F1</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="600" x="180" y="172">2·P·R / (P+R)</text></g><circle cx="662" cy="503" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="510">Precisão e revocação (recall) medem aspectos</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="536">diferentes.</text><circle cx="662" cy="569" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="576">F1 equilibra ambas; acurácia pode mascarar</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="602">desbalanceamento.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="55" y="664" /><rect fill="#218AE8" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="73" y="687" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="94" y="712">Regressão: erros numéricos</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="79" y="732" /><g transform="translate(83,740)"><rect fill="#DAF6E6" height="54" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="143" x="5" y="9" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="76.5" y="43.0">MAE</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="600" x="172" y="43">média de |erro|</text><rect fill="#EAE8FC" height="54" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="143" x="5" y="70" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="76.5" y="104.0">MSE</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="600" x="172" y="104">média de (erro)²</text><rect fill="#DAF6E6" height="54" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="143" x="5" y="131" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="76.5" y="165.0">RMSE</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="600" x="172" y="165">raiz quadrada do MSE</text></g><circle cx="87" cy="955" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="962">MAE usa valor absoluto; MSE penaliza erros</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="988">grandes.</text><circle cx="87" cy="1021" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="1028">RMSE volta à unidade original da variável alvo.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="664" /><rect fill="#218AE8" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="648" y="687" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="669" y="712">Curva ROC e área AUC</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="654" y="732" /><g transform="translate(658,740)"><line stroke="#52637C" stroke-width="2" x1="38" x2="462" y1="162" y2="162" /><line stroke="#52637C" stroke-width="2" x1="38" x2="38" y1="162" y2="10" /><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="500" x="466" y="168">x</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="500" x="25" y="4">y</text><line stroke="#52637C" stroke-dasharray="7 7" stroke-width="2" x1="39" x2="462" y1="163" y2="10" /><path d="M 40,162 C 75,62 150,23 456,18" fill="none" stroke="#17A877" stroke-width="5" /><text fill="#17A877" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="800" x="281" y="81">AUC</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="middle" x="250" y="183">FPR →    •    TPR (recall) ↑</text></g><circle cx="662" cy="955" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="962">ROC varia o limiar e relaciona TPR com FPR.</text><circle cx="662" cy="995" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1002">AUC 0,5 se aproxima de uma ordenação</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1028">aleatória.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="55" y="1116" /><rect fill="#EF9665" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="73" y="1139" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="94" y="1164">Classes raras: curva PR</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="79" y="1184" /><g transform="translate(83,1192)"><line stroke="#52637C" stroke-width="2" x1="38" x2="462" y1="160" y2="160" /><line stroke="#52637C" stroke-width="2" x1="38" x2="38" y1="160" y2="12" /><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="500" x="466" y="166">x</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="500" x="25" y="6">y</text><path d="M 43,24 C 90,27 153,42 205,72 S 338,125 456,157" fill="none" stroke="#EF9665" stroke-width="5" /><text fill="#EF9665" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" x="286" y="43">Precisão × revocação</text></g><circle cx="87" cy="1407" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="1414">Precisão × revocação pode informar melhor em</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="1440">classe rara.</text><circle cx="87" cy="1473" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="1480">Não usar só acurácia com dados muito</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="102" y="1506">desbalanceados.</text><rect fill="#FFFFFF" height="430" rx="18" ry="18" stroke="#DBE4F0" stroke-width="2" width="555" x="630" y="1116" /><rect fill="#EF9665" height="29" rx="2" ry="2" stroke="none" stroke-width="2" width="7" x="648" y="1139" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="800" x="669" y="1164">Qual métrica usar?</text><rect fill="#F5F8FC" height="207" rx="11" ry="11" stroke="#EDF2F8" stroke-width="1" width="507" x="654" y="1184" /><g transform="translate(658,1192)"><rect fill="#DAF6E6" height="101" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="230" x="8" y="36" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="123.0" y="94.55">Generalização</text><rect fill="#FFF1C3" height="101" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="230" x="258" y="36" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="373.0" y="94.55">Simplicidade</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="250" y="182">Sempre medir nos dados não vistos</text></g><circle cx="662" cy="1407" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1414">Falso positivo caro: observar precisão e custos.</text><circle cx="662" cy="1447" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1454">Falso negativo caro: observar revocação e</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1480">custos.</text><line stroke="#DBE4F0" stroke-width="2" x1="57" x2="1183" y1="1621" y2="1621" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="800" x="58" y="1652">CADERNO VISUAL • IA / ML</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="end" x="1183" y="1652">Edição revisada • PT-BR</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="500" x="58" y="1693">Diagramas originais recriados • Conteúdo didático e verificável</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="800" text-anchor="end" x="1183" y="1693">09</text></svg>
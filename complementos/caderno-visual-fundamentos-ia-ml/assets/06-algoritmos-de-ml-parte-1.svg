" x="677" y="1480">Use conjuntos independentes e métricas</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="500" x="677" y="1506">pertinentes.</text><line stroke="#DBE4F0" stroke-width="2" x1="57" x2="1183" y1="1621" y2="1621" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="800" x="58" y="1652">CADERNO VISUAL • IA / ML</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="end" x="1183" y="1652">Edição revisada • PT-BR</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="500" x="58" y="1693">Diagramas originais recriados • Conteúdo didático e verificável</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="800" text-anchor="end" x="1183" y="1693">06</text></svg>
<svg baseProfile="full" height="1754" version="1.1" viewBox="0 0 1240 1754" width="1240" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F5F8FC" height="1754" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0" /><rect fill="#101D3E" height="182" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0" /><rect fill="#1DAFC6" height="80" rx="13" ry="13" stroke="none" stroke-width="2" width="79" x="52" y="33" /><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="37" font-weight="700" text-anchor="middle" x="91" y="90">12</text><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="37" font-weight="700" x="160" y="77">IA generativa e modelos de linguagem</text><text fill="#D1D9EA" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="400" x="160" y="125">Do treinamento à geração: exemplos e limites</text><text fill="#A4E7DF" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="end" x="1179" y="63">B/2</text><line stroke="#DBE4F0" stroke-width="2" x1="55" x2="1185" y1="1678" y2="1678" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" x="57" y="1711">CADERNO VISUAL • IA / ML</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="end" x="1183" y="1711">Cap. 12 • Parte 2</text><rect fill="#FFFFFF" height="501" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="1130" x="54" y="208" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="232" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="258">Ciclo de vida simplificado de um modelo</text><rect fill="#F5F8FC" height="210" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="1094" x="73" y="285" /><rect fill="#EAE8FC" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="244" x="95" y="343" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="217.0" y="388.895">Pré-treino</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="217" y="451">padrões gerais</text><line stroke="#218AE8" stroke-width="3" x1="340" x2="365" y1="380" y2="380" /><polygon fill="#218AE8" points="365,380 354.9560216565646,384.48536498365524 354.9560216565646,375.51463501634476" /><rect fill="#FFF1C3" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="244" x="368" y="343" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="490.0" y="388.895">Ajustes</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="490" y="451">instruções/alinhamento</text><line stroke="#218AE8" stroke-width="3" x1="613" x2="638" y1="380" y2="380" /><polygon fill="#218AE8" points="638,380 627.9560216565646,384.48536498365524 627.9560216565646,375.51463501634476" /><rect fill="#DAF6E6" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="244" x="641" y="343" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="763.0" y="388.895">Inferência</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="763" y="451">resposta ao contexto</text><line stroke="#218AE8" stroke-width="3" x1="886" x2="911" y1="380" y2="380" /><polygon fill="#218AE8" points="911,380 900.9560216565646,384.48536498365524 900.9560216565646,375.51463501634476" /><rect fill="#EAE8FC" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="244" x="914" y="343" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="1036.0" y="388.895">Avaliação</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1036" y="451">testes + monitoração</text><circle cx="94" cy="539" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="109" y="547.0">Pré-treino aprende regularidades de dados em escala; ajustes podem orientar tarefas e comportamentos.</text><circle cx="94" cy="578.2" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="109" y="586.2">Na inferência, o modelo produz uma saída condicionada à entrada; desempenho deve ser avaliado na prática.</text><rect fill="#FFFFFF" height="668" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="54" y="729" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="753" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="779">GPT e outros modelos</text><rect fill="#F5F8FC" height="252" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="518" x="72" y="808" /><rect fill="#EAE8FC" height="101" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="184" x="93" y="842" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="185.0" y="887.9399999999999">GPT</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="185.0" y="910.93">(decodificador)</text><rect fill="#DAF6E6" height="101" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="194" x="363" y="842" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="460.0" y="887.9399999999999">BERT</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="460.0" y="910.93">(codificador)</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" x="325" y="899">×</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="330" y="1007">Arquiteturas com focos diferentes</text><circle cx="96" cy="1094" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="111" y="1102.0">GPT significa Generative Pre-trained Transformer.</text><circle cx="96" cy="1133.2" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="111" y="1141.2">Modelos do tipo GPT geram tokens sob uma</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="111" y="1168.4">máscara causal; não são uma cópia completa do</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="111" y="1195.6000000000001">Transformer original.</text><rect fill="#FFFFFF" height="668" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="554" x="630" y="729" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="648" y="753" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="672" y="779">Aplicações e cautelas</text><rect fill="#F5F8FC" height="253" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="516" x="648" y="808" /><rect fill="#EAE8FC" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="156" x="663" y="822" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="741.0" y="861.57">Texto</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="833" y="860">redação, síntese e tradução</text><rect fill="#FFF1C3" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="156" x="663" y="902" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="741.0" y="941.57">Código</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="833" y="940">explicações e sugestões</text><rect fill="#DAF6E6" height="66" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="156" x="663" y="982" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="741.0" y="1021.57">Multimodal</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="833" y="1020">imagem, áudio e vídeo</text><circle cx="673" cy="1094" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="688" y="1102.0">Saídas plausíveis podem estar erradas; validar fatos,</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="688" y="1129.2">cálculos, fontes e segurança.</text><circle cx="673" cy="1160.4" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="688" y="1168.4">Aplicações críticas exigem controles humanos e</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="688" y="1195.6000000000001">evidências externas.</text><rect fill="#FFF1C3" height="196" rx="14" ry="14" stroke="none" stroke-width="2" width="1129" x="55" y="1422" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" x="80" y="1462">Síntese para o leitor</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="80" y="1495">Treinamento: ajusta parâmetros. Inferência: usa os parâmetros. RAG: fornece contexto recuperado na inferência (capítulo 13).</text></svg>
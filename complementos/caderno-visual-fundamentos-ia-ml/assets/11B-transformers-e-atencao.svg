<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1754" version="1.1" viewBox="0 0 1240 1754" width="1240" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F5F8FC" height="1754" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0" /><rect fill="#101D3E" height="182" rx="0" ry="0" stroke="none" stroke-width="2" width="1240" x="0" y="0" /><rect fill="#1DAFC6" height="80" rx="13" ry="13" stroke="none" stroke-width="2" width="79" x="52" y="33" /><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="37" font-weight="700" text-anchor="middle" x="91" y="90">11</text><text fill="#FFFFFF" font-family="Lato, DejaVu Sans, sans-serif" font-size="37" font-weight="700" x="160" y="77">Transformers e atenção</text><text fill="#D1D9EA" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="400" x="160" y="125">Arquitetura histórica e famílias usadas nos modelos modernos</text><text fill="#A4E7DF" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="end" x="1179" y="63">B/2</text><line stroke="#DBE4F0" stroke-width="2" x1="55" x2="1185" y1="1678" y2="1678" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" x="57" y="1711">CADERNO VISUAL • IA / ML</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="end" x="1183" y="1711">Cap. 11 • Parte 2</text><rect fill="#FFFFFF" height="523" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="1130" x="54" y="207" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="231" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="257">O bloco Transformer (visão didática)</text><rect fill="#F5F8FC" height="309" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="1085" x="76" y="287" /><rect fill="#FFF1C3" height="85" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="193" x="110" y="363" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="206.5" y="412.79999999999995">Entrada + posições</text><rect fill="#EAE8FC" height="85" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="210" x="355" y="363" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="460.0" y="412.07">Atenção multicabeça</text><rect fill="#DAF6E6" height="85" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="183" x="615" y="363" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="706.5" y="413.165">Rede FFN</text><rect fill="#EAE8FC" height="85" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="198" x="848" y="363" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="947.0" y="412.07">Representações</text><line stroke="#218AE8" stroke-width="3" x1="303" x2="351" y1="405" y2="405" /><polygon fill="#218AE8" points="351,405 340.9560216565646,409.48536498365524 340.9560216565646,400.51463501634476" /><line stroke="#218AE8" stroke-width="3" x1="565" x2="611" y1="405" y2="405" /><polygon fill="#218AE8" points="611,405 600.9560216565646,409.48536498365524 600.9560216565646,400.51463501634476" /><line stroke="#218AE8" stroke-width="3" x1="798" x2="844" y1="405" y2="405" /><polygon fill="#218AE8" points="844,405 833.9560216565646,409.48536498365524 833.9560216565646,400.51463501634476" /><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="580" y="332">Bloco repetido × N • normalização e conexões residuais</text><rect fill="#F5F8FC" height="82" rx="10" ry="10" stroke="#DBE4F0" stroke-width="1" width="937" x="109" y="482" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" x="131" y="512">Codificador:</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="280" y="512">atenção bidirecional (ex.: BERT)</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="700" x="131" y="542">Decodificador:</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="283" y="542">atenção causal para geração (ex.: GPT)</text><circle cx="96" cy="634" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="111" y="642.0">No artigo original, Transformer combina codificador e decodificador; há também variantes só codificador ou só</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="111" y="669.2">decodificador.</text><rect fill="#FFFFFF" height="646" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="54" y="750" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="774" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="800">Atenção escalada por produto escalar</text><rect fill="#F5F8FC" height="276" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="517" x="73" y="835" /><rect fill="#EAE8FC" height="99" rx="14" ry="14" stroke="#8F74D6" stroke-width="2" width="498" x="89" y="858" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="336" y="900">Atenção(Q, K, V) =</text><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="337" y="931">softmax( QKᵀ / √d_k ) · V</text><rect fill="#DAF6E6" height="65" rx="11" ry="11" stroke="none" stroke-width="2" width="152" x="104" y="985" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="181" y="1013">Q</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="181" y="1037">consulta</text><rect fill="#DAF6E6" height="65" rx="11" ry="11" stroke="none" stroke-width="2" width="152" x="273" y="985" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="350" y="1013">K</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="350" y="1037">chaves</text><rect fill="#DAF6E6" height="65" rx="11" ry="11" stroke="none" stroke-width="2" width="152" x="442" y="985" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="519" y="1013">V</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="519" y="1037">valores</text><circle cx="95" cy="1145" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="110" y="1153.0">Q = consultas; K = chaves; V = valores; d_k é a</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="110" y="1180.2">dimensão das chaves.</text><circle cx="95" cy="1211.4" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="110" y="1219.4">A máscara causal impede a leitura dos tokens futuros</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="110" y="1246.6000000000001">na geração autorregressiva.</text><rect fill="#FFFFFF" height="646" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="554" x="630" y="750" /><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="648" y="774" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="672" y="800">Três organizações de modelos</text><rect fill="#F5F8FC" height="315" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="516" x="648" y="835" /><rect fill="#EAE8FC" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="196" x="660" y="848" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="758.0" y="892.435">Codificador</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="877" y="883">BERT • lê a sequência</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="877" y="910">contexto nas duas direções</text><rect fill="#DAF6E6" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="196" x="660" y="941" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="758.0" y="985.435">Decodificador</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="877" y="976">GPT • gera passo a passo</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="877" y="1003">máscara causal no texto</text><rect fill="#FFF1C3" height="75" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="196" x="660" y="1034" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="758.0" y="1078.4350000000002">Enc. + Dec.</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="877" y="1069">T5 • entrada → saída</text><text fill="#52637C" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="877" y="1096">atenção cruzada entre blocos</text><circle cx="668" cy="1169" fill="#17A877" r="4" stroke="none" stroke-width="2" /><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="683" y="1177.0">BERT, GPT e T5 são exemplos de famílias com</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" font-weight="400" x="683" y="1204.2">objetivos e formas de atenção distintos.</text><rect fill="#FFF1C3" height="205" rx="14" ry="14" stroke="none" stroke-width="2" width="1129" x="55" y="1420" /><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="700" x="80" y="1460">Nota importante</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="80" y="1493">Autoatenção não significa que cada token sempre pode ver todos os outros: máscaras, janelas de contexto e a organização do</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="80" y="1518">modelo determinam as conexões permitidas.</text></svg>
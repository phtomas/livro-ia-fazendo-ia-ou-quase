fill="#EAE8FC" height="61" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="154" x="85" y="303"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="162.0" y="340.07">Papel</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="255" y="340">Você é um revisor técnico...</text><rect fill="#DAF6E6" height="61" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="154" x="85" y="378"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="162.0" y="415.07">Tarefa</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="255" y="415">Compare as duas soluções.</text><rect fill="#FFF1C3" height="61" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="154" x="85" y="453"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="162.0" y="490.07">Contexto</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="255" y="490">Uso: manual de reparos.</text><rect fill="#F8DFEF" height="61" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="154" x="85" y="528"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="162.0" y="565.07">Restrições</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="255" y="565">Não invente medidas.</text><rect fill="#EAE8FC" height="61" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="154" x="85" y="603"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="162.0" y="640.07">Formato</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" x="255" y="640">Tabela + evidências.</text><circle cx="92" cy="724" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="107" y="732.0">Papel é opcional. Objetivo, contexto e critérios de</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="107" y="757.84">aceitação são essenciais.</text><rect fill="#FFFFFF" height="638" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="554" x="630" y="207"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="648" y="231"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="672" y="257">Técnicas de instrução</text><rect fill="#F5F8FC" height="413" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="514" x="650" y="282"/><rect fill="#EAE8FC" height="77" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="189" x="661" y="303"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="755.5" y="348.07">Sem exemplos</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="866" y="337.0">Objetivo direto; zero-shot</text><rect fill="#DAF6E6" height="77" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="189" x="661" y="406"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="755.5" y="451.07">Com exemplos</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="866" y="440.0">Few-shot para formato ou padrão</text><rect fill="#FFF1C3" height="77" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="189" x="661" y="509"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="755.5" y="554.07">Saída estruturada</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="866" y="543.0">JSON com esquema validável</text><circle cx="669" cy="724" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="684" y="732.0">Exemplos devem representar os casos reais; esquemas</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="684" y="757.84">precisam de validação automática.</text><rect fill="#FFFFFF" height="640" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="555" x="54" y="865"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="72" y="889"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="96" y="915">Teste em vez de palpite</text><rect fill="#F5F8FC" height="414" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="517" x="72" y="945"/><rect fill="#EAE8FC" height="84" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="174" x="86" y="965"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="173.0" y="1013.935">Caso de teste</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="275" y="1012">Pergunta representativa</text><rect fill="#FFF1C3" height="84" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="174" x="86" y="1077"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="173.0" y="1125.9350000000002">Saída esperada</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="275" y="1124">Critérios e fontes</text><rect fill="#DAF6E6" height="84" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="174" x="86" y="1189"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="173.0" y="1237.9350000000002">Avaliação</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" x="275" y="1236">Acurácia, segurança, custo</text><circle cx="94" cy="1388" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="109" y="1396.0">Meça falhas recorrentes em um conjunto de perguntas</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="109" y="1421.84">reais, não em uma só demonstração.</text><rect fill="#FFFFFF" height="640" rx="16" ry="16" stroke="#DBE4F0" stroke-width="2" width="554" x="630" y="865"/><rect fill="#17A877" height="31" rx="3" ry="3" stroke="none" stroke-width="2" width="7" x="648" y="889"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="27" font-weight="700" x="672" y="915">Prompts de raciocínio: nuance</text><rect fill="#F5F8FC" height="415" rx="10" ry="10" stroke="#EDF2F8" stroke-width="1" width="515" x="649" y="945"/><rect fill="#DAF6E6" height="89" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="461" x="674" y="977"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="904.5" y="1029.53">Peça conclusão verificável</text><rect fill="#FFF1C3" height="89" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="461" x="674" y="1090"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="904.5" y="1142.165">Requisite cálculos e fontes</text><rect fill="#EAE8FC" height="89" rx="12" ry="12" stroke="#DBE4F0" stroke-width="2" width="461" x="674" y="1203"/><text fill="#101D3E" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="904.5" y="1254.4350000000002">Evite exigir raciocínio interno</text><circle cx="673" cy="1389" fill="#17A877" r="4" stroke="none" stroke-width="2"/><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="688" y="1397.0">Em modelos de raciocínio, “pense passo a passo” não é</text><text fill="#1C2C4B" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" x="688" y="1422.84">uma melhoria garantida.</text></svg>
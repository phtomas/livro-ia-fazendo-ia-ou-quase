<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1310" viewBox="0 0 1600 1310" role="img" aria-labelledby="t d"><title id="t">Arquitetura RAG: dois fluxos, preparação e consulta</title><desc id="d">A preparação do conhecimento extrai fontes, limpa, fragmenta e indexa. Separadamente, a pergunta do usuário prepara uma consulta, recupera informação no índice, pode reranquear, monta um prompt, chama um modelo de linguagem e produz uma resposta com fontes. Avaliações e segurança acompanham os dois fluxos.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#146f78"/></marker><linearGradient id="fadeA" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#eaf9f7"/><stop offset="1" stop-color="#f5faf9"/></linearGradient><linearGradient id="fadeB" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ebf1ff"/><stop offset="1" stop-color="#f7f9ff"/></linearGradient></defs>
<rect x="0" y="0" width="1600" height="1310" rx="0" fill="#fbfcfa" stroke="#fbfcfa" stroke-width="2"/>
<rect width="1600" height="14" fill="#126c71"/>
<text x="56" y="81" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="780" font-size="54" fill="#102d42">RAG: DA FONTE À RESPOSTA</text>
<text x="58" y="126" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="24" fill="#56717b">Arquitetura conceitual revisada · duas trilhas conectadas por um índice de busca</text>
<rect x="42" y="159" width="1516" height="389" rx="25" fill="url(#fadeA)" stroke="#9dcfc8" stroke-width="2"/>
<rect x="58" y="174" width="1484" height="70" rx="23" fill="#076969" stroke="#076969" stroke-width="2"/>
<text x="82" y="220" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="39" fill="#fff">A</text>
<text x="141" y="219" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="29" fill="#fff">PREPARAÇÃO DO CONHECIMENTO</text>
<text x="974" y="217" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="430" font-size="21" fill="#e0f8f2">Ingestão e indexação (antecipada ou periódica)</text>
<rect x="67" y="273" width="260" height="207" rx="17" fill="#ffffff" stroke="#b3d8d3" stroke-width="2"/>
<text x="197" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#0b4850">Fontes</text>
<text x="197" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">PDFs, sites,</text><text x="197" y="390" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">SQL e APIs</text>
<path d="M330 376 L363 376" fill="none" stroke="#146f78" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="367" y="273" width="260" height="207" rx="17" fill="#ffffff" stroke="#b3d8d3" stroke-width="2"/>
<text x="497" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#0b4850">Extração</text>
<text x="497" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#0b4850">e limpeza</text>
<text x="497" y="384" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">Ler conteúdo,</text><text x="497" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">remover ruído</text>
<path d="M630 376 L663 376" fill="none" stroke="#146f78" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="667" y="273" width="260" height="207" rx="17" fill="#ffffff" stroke="#b3d8d3" stroke-width="2"/>
<text x="797" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#0b4850">Trechos</text>
<text x="797" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#0b4850">e metadados</text>
<text x="797" y="384" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">Chunks, títulos,</text><text x="797" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">origem e página</text>
<path d="M930 376 L963 376" fill="none" stroke="#146f78" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="967" y="273" width="260" height="207" rx="17" fill="#eaf4ff" stroke="#b3d8d3" stroke-width="2"/>
<text x="1097" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#0b4850">Indexação</text>
<text x="1097" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">Textual: BM25</text><text x="1097" y="390" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">Vetorial: embeddings</text><text x="1097" y="418" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">Ou busca híbrida</text>
<path d="M1230 376 L1263 376" fill="none" stroke="#146f78" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="1267" y="273" width="260" height="207" rx="17" fill="#d9f5eb" stroke="#66b8a8" stroke-width="2"/>
<text x="1397" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#0b4850">Índice</text>
<text x="1397" y="345" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="26" fill="#0b4850">consultável</text>
<text x="1397" y="384" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">Textual, vetorial</text><text x="1397" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#476a72">ou híbrido</text>
<text x="80" y="522" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#477f78">Embeddings são necessários para indexação vetorial; não são obrigatórios para busca lexical.</text>
<path d="M1397 483 L1397 582 L590 582 L590 714" stroke="#168d83" stroke-width="5" stroke-dasharray="13 10" fill="none" marker-end="url(#arr)"/>
<rect x="825" y="557" width="400" height="47" rx="20" fill="#ffffff" stroke="#8bbab6" stroke-width="2"/>
<text x="1025" y="587" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="19" fill="#17676b">O índice alimenta a recuperação ↓</text>
<rect x="42" y="626" width="1516" height="403" rx="25" fill="url(#fadeB)" stroke="#a5bbdf" stroke-width="2"/>
<rect x="58" y="644" width="1484" height="68" rx="23" fill="#203e78" stroke="#203e78" stroke-width="2"/>
<text x="82" y="691" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="39" fill="#ffffff">B</text>
<text x="140" y="689" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="30" fill="#fff">CONSULTA E GERAÇÃO</text>
<text x="1013" y="689" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="21" fill="#e8efff">Acontece quando o usuário pergunta</text>
<rect x="56" y="752" width="198" height="228" rx="16" fill="#ffffff" stroke="#c8d6e7" stroke-width="2"/>
<text x="155" y="792" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="23" fill="#173956">Pergunta</text>
<text x="155" y="820" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="22" fill="#173956">do usuário</text>
<text x="155" y="872" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">Questão e</text><text x="155" y="898" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">intenção</text>
<path d="M257 865 L271 865" fill="none" stroke="#146f78" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="274" y="752" width="198" height="228" rx="16" fill="#ffffff" stroke="#c8d6e7" stroke-width="2"/>
<text x="373" y="792" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="23" fill="#173956">Preparar</text>
<text x="373" y="820" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="22" fill="#173956">consulta</text>
<text x="373" y="872" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">Reformular; HyDE</text><text x="373" y="898" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">e embedding</text><text x="373" y="924" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">se adequados</text>
<path d="M475 865 L489 865" fill="none" stroke="#146f78" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="492" y="752" width="198" height="228" rx="16" fill="#d7f1ed" stroke="#6ea8aa" stroke-width="2"/>
<text x="591" y="792" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="23" fill="#173956">Recuperar</text>
<text x="591" y="820" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="22" fill="#173956">no índice</text>
<text x="591" y="872" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">Busca lexical,</text><text x="591" y="898" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">vetorial ou híbrida</text>
<path d="M693 865 L707 865" fill="none" stroke="#146f78" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="710" y="752" width="198" height="228" rx="16" fill="#ffffff" stroke="#c8d6e7" stroke-width="2"/>
<text x="809" y="792" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="23" fill="#173956">Reranquear</text>
<text x="809" y="820" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="22" fill="#173956">(opcional)</text>
<text x="809" y="872" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">Filtrar e ordenar</text><text x="809" y="898" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">resultados</text>
<path d="M911 865 L925 865" fill="none" stroke="#146f78" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="928" y="752" width="198" height="228" rx="16" fill="#ffffff" stroke="#c8d6e7" stroke-width="2"/>
<text x="1027" y="792" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="23" fill="#173956">Montar</text>
<text x="1027" y="820" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="22" fill="#173956">o prompt</text>
<text x="1027" y="872" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">Pergunta + trechos</text><text x="1027" y="898" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">+ instruções</text>
<path d="M1129 865 L1143 865" fill="none" stroke="#146f78" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="1146" y="752" width="198" height="228" rx="16" fill="#ffffff" stroke="#c8d6e7" stroke-width="2"/>
<text x="1245" y="792" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="23" fill="#173956">Gerar</text>
<text x="1245" y="820" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="22" fill="#173956">com LLM</text>
<text x="1245" y="872" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">Responder com</text><text x="1245" y="898" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">base no contexto</text>
<path d="M1347 865 L1361 865" fill="none" stroke="#146f78" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="1364" y="752" width="198" height="228" rx="16" fill="#e5f6e6" stroke="#c8d6e7" stroke-width="2"/>
<text x="1463" y="792" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="23" fill="#173956">Resposta</text>
<text x="1463" y="820" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="22" fill="#173956">com fontes</text>
<text x="1463" y="872" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">Citar origem;</text><text x="1463" y="898" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="420" font-size="18" fill="#496273">indicar incerteza</text>
<text x="65" y="1011" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="18" fill="#47617f">A busca consulta o mesmo índice preparado na trilha A. Reranqueamento não é HyDE.</text>
<rect x="47" y="1044" width="1506" height="92" rx="18" fill="#ecf5f2" stroke="#bedad4" stroke-width="2"/>
<text x="74" y="1080" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="760" font-size="23" fill="#1e5c59">CONTROLES TRANSVERSAIS</text>
<text x="74" y="1111" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#456b69">Permissões por documento · Atualização do índice · Logs e métricas · Avaliações · Segurança · Revisão humana quando necessária</text>
<rect x="47" y="1152" width="1506" height="92" rx="18" fill="#fff7e5" stroke="#e2d4b4" stroke-width="2"/>
<text x="72" y="1189" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="760" font-size="22" fill="#815a19">TRÊS CUIDADOS IMPORTANTES</text>
<text x="72" y="1220" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="490" font-size="20" fill="#7a6238">BM25 = busca lexical  ·  HyDE = preparação da consulta (não reranking)  ·  RAG ≠ banco vetorial obrigatório</text>
<text x="800" y="1279" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="410" font-size="18" fill="#5c7079">Diagrama conceitual original · José Albuquerque · referência temática atribuída: Jothi Moorthy</text>
</svg>
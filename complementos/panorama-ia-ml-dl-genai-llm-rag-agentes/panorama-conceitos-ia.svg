<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1490" width="1680" height="1490" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Panorama de IA: ML, DL, IA generativa, LLM, RAG e sistemas agênticos</title>
<desc id="dsc">Infográfico com relações técnicas não lineares. Inteligência artificial abrange aprendizado de máquina, que abrange deep learning. IA generativa e LLMs são abordagens de geração, enquanto RAG e sistemas agênticos são arquiteturas de aplicação que podem reutilizar modelos e ferramentas.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#477E99"/></marker></defs><rect x="0" y="0" width="1680" height="1490" rx="18" fill="#F7FAFD" stroke="none" stroke-width="1.6"/><rect width="1680" height="14" fill="#153C75"/><text x="64" y="87" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="800" fill="#132A4A">IA, ML, DL, IA GENERATIVA, LLMs, RAG E AGENTES</text><text x="64" y="132" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#4E6279">O que cada conceito significa — e como eles realmente se relacionam</text><rect x="48" y="169" width="1584" height="416" rx="24" fill="#FFFFFF" stroke="#CFDCE8" stroke-width="2"/><text x="80" y="215" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#214B75">1 · ÁREAS E TÉCNICAS</text><text x="80" y="247" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#58728B">Relação de abrangência (simplificada)</text><text x="80" y="274" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#58728B">entre três campos técnicos</text><rect x="80" y="298" width="840" height="244" rx="26" fill="#E9F3FF" stroke="#87B4E6" stroke-width="3"/><text x="106" y="340" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="750" fill="#225BB0">INTELIGÊNCIA ARTIFICIAL</text><rect x="133" y="361" width="730" height="153" rx="24" fill="#E3F9F1" stroke="#7DC7A7" stroke-width="3"/><text x="155" y="396" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="750" fill="#137E64">APRENDIZADO DE MÁQUINA (ML)</text><rect x="212" y="419" width="565" height="69" rx="22" fill="#F2E9FF" stroke="#B595E3" stroke-width="3"/><text x="495" y="464" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="750" fill="#7847AB">DEEP LEARNING (DL)</text><text x="986" y="221" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#214B75">2 · FOCO NA GERAÇÃO</text><rect x="975" y="254" width="617" height="110" rx="18" fill="#FFF3DD" stroke="#EDB85F" stroke-width="2"/><text x="1004" y="296" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" fill="#B66612">IA GENERATIVA</text><text x="1004" y="332" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" fill="#855929">Produz texto, imagem, áudio, código etc.</text><path d="M1280 366 L1280 386" stroke="#A78543" stroke-width="3"  stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><rect x="1015" y="390" width="538" height="154" rx="18" fill="#EBF9F8" stroke="#63B3B2" stroke-width="2"/><text x="1046" y="434" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#167D84">LLMs</text><text x="1046" y="471" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#43676B">Modelos de linguagem de grande porte.</text><text x="1046" y="498" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#43676B">Frequentemente usados para gerar texto;</text><text x="1046" y="525" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#43676B">também podem analisar e transformar conteúdo.</text><text x="81" y="570" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#667E8E">Esta relação resume os casos mais comuns; IA generativa não é um degrau obrigatório após DL.</text><rect x="48" y="612" width="1584" height="184" rx="22" fill="#EAF4F8" stroke="#B8D3DD" stroke-width="2"/><text x="78" y="659" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#20566A">3 · PADRÕES PARA CONSTRUIR APLICAÇÕES</text><rect x="78" y="684" width="714" height="83" rx="17" fill="#FFE8ED" stroke="#E9A0B0" stroke-width="2"/><text x="106" y="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#B52D57">RAG</text><text x="106" y="749" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#624752">Busca informação externa e a entrega ao modelo.</text><rect x="827" y="684" width="775" height="83" rx="17" fill="#EEEAFD" stroke="#B8A8EE" stroke-width="2"/><text x="856" y="720" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#6F49BB">IA AGÊNTICA</text><text x="856" y="749" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#51476A">Planeja e executa etapas com ferramentas e supervisão.</text><text x="79" y="818" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#345A70">UM SISTEMA PODE COMBINAR LLM + RAG + AGENTES, MAS NENHUM DELES É UMA ETAPA OBRIGATÓRIA.</text><text x="64" y="874" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="780" fill="#1B3B59">SETE CONCEITOS · SETE PAPÉIS DIFERENTES</text><rect x="50" y="899" width="375" height="249" rx="18" fill="#EDF5FF" stroke="#2D79D7" stroke-width="2"/><rect x="66" y="917" width="45" height="45" rx="12" fill="#2D79D7" stroke="none" stroke-width="1.6"/><text x="88" y="948" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#FFF">01</text><rect x="120" y="922" width="160" height="34" rx="16" fill="#FFF" stroke="none" stroke-width="1.6"/><text x="200" y="946" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="760" fill="#2D79D7">CAMPO GERAL</text><text x="70" y="990" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="830" fill="#2D79D7">IA</text><text x="70" y="1019" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243B56">Inteligência Artificial</text><text x="70" y="1055" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">Sistemas que realizam tarefas</text><text x="70" y="1078" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">associadas à inteligência.</text><text x="70" y="1101" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">Inclui soluções com regras</text><text x="70" y="1124" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">e métodos aprendidos.</text><rect x="63" y="1113" width="349" height="27" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="72" y="1133" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="610" fill="#2D79D7">Ex.: sistemas especialistas</text><rect x="457" y="899" width="375" height="249" rx="18" fill="#EAFAF3" stroke="#149166" stroke-width="2"/><rect x="473" y="917" width="45" height="45" rx="12" fill="#149166" stroke="none" stroke-width="1.6"/><text x="495" y="948" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#FFF">02</text><rect x="527" y="922" width="160" height="34" rx="16" fill="#FFF" stroke="none" stroke-width="1.6"/><text x="607" y="946" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="760" fill="#149166">SUBCAMPO DE IA</text><text x="477" y="990" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="830" fill="#149166">ML</text><text x="477" y="1019" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243B56">Machine Learning</text><text x="477" y="1055" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">Métodos que ajustam</text><text x="477" y="1078" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">padrões a partir de dados,</text><text x="477" y="1101" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">sem programar cada regra</text><text x="477" y="1124" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">da tarefa.</text><rect x="470" y="1113" width="349" height="27" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="479" y="1133" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="610" fill="#149166">Ex.: filtro de spam</text><rect x="864" y="899" width="375" height="249" rx="18" fill="#F4EEFE" stroke="#8146BA" stroke-width="2"/><rect x="880" y="917" width="45" height="45" rx="12" fill="#8146BA" stroke="none" stroke-width="1.6"/><text x="902" y="948" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#FFF">03</text><rect x="934" y="922" width="160" height="34" rx="16" fill="#FFF" stroke="none" stroke-width="1.6"/><text x="1014" y="946" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="760" fill="#8146BA">SUBCAMPO DE ML</text><text x="884" y="990" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="830" fill="#8146BA">DL</text><text x="884" y="1019" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243B56">Deep Learning</text><text x="884" y="1055" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">Redes neurais profundas</text><text x="884" y="1078" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">aprendem representações</text><text x="884" y="1101" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">em múltiplas camadas.</text><rect x="877" y="1113" width="349" height="27" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="886" y="1133" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="610" fill="#8146BA">Ex.: reconhecimento de fala</text><rect x="1271" y="899" width="375" height="249" rx="18" fill="#FFF4E5" stroke="#CC7617" stroke-width="2"/><rect x="1287" y="917" width="45" height="45" rx="12" fill="#CC7617" stroke="none" stroke-width="1.6"/><text x="1309" y="948" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#FFF">04</text><rect x="1341" y="922" width="240" height="34" rx="16" fill="#FFF" stroke="none" stroke-width="1.6"/><text x="1461" y="946" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="760" fill="#CC7617">TIPO DE APLICAÇÃO/MODELO</text><text x="1291" y="990" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="830" fill="#CC7617">GenAI</text><text x="1291" y="1019" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243B56">IA Generativa</text><text x="1291" y="1055" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">Cria ou transforma</text><text x="1291" y="1078" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">conteúdo: texto, imagem,</text><text x="1291" y="1101" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">áudio, vídeo e código.</text><rect x="1284" y="1113" width="349" height="27" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="1293" y="1133" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="610" fill="#CC7617">Ex.: geração de imagens</text><rect x="254" y="1170" width="375" height="249" rx="18" fill="#E8F8F8" stroke="#088B92" stroke-width="2"/><rect x="270" y="1188" width="45" height="45" rx="12" fill="#088B92" stroke="none" stroke-width="1.6"/><text x="292" y="1219" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#FFF">05</text><rect x="324" y="1193" width="160" height="34" rx="16" fill="#FFF" stroke="none" stroke-width="1.6"/><text x="404" y="1217" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="760" fill="#088B92">MODELO</text><text x="274" y="1261" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="830" fill="#088B92">LLM</text><text x="274" y="1290" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243B56">Modelo de Linguagem</text><text x="274" y="1326" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">Aprende padrões em texto</text><text x="274" y="1349" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">e produz ou processa</text><text x="274" y="1372" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">sequências de linguagem.</text><rect x="267" y="1384" width="349" height="27" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="276" y="1404" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="610" fill="#088B92">Ex.: assistente de texto</text><rect x="661" y="1170" width="375" height="249" rx="18" fill="#FFF0F3" stroke="#C33E68" stroke-width="2"/><rect x="677" y="1188" width="45" height="45" rx="12" fill="#C33E68" stroke="none" stroke-width="1.6"/><text x="699" y="1219" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#FFF">06</text><rect x="731" y="1193" width="190" height="34" rx="16" fill="#FFF" stroke="none" stroke-width="1.6"/><text x="826" y="1217" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="760" fill="#C33E68">PADRÃO DE APLICAÇÃO</text><text x="681" y="1261" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="830" fill="#C33E68">RAG</text><text x="681" y="1290" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243B56">Geração com Recuperação</text><text x="681" y="1326" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">Recupera evidências em</text><text x="681" y="1349" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">fontes externas e as usa</text><text x="681" y="1372" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">no contexto da resposta.</text><rect x="674" y="1384" width="349" height="27" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="683" y="1404" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="610" fill="#C33E68">Ex.: perguntas sobre documentos</text><rect x="1068" y="1170" width="375" height="249" rx="18" fill="#F2EFFF" stroke="#6E56C2" stroke-width="2"/><rect x="1084" y="1188" width="45" height="45" rx="12" fill="#6E56C2" stroke="none" stroke-width="1.6"/><text x="1106" y="1219" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#FFF">07</text><rect x="1138" y="1193" width="220" height="34" rx="16" fill="#FFF" stroke="none" stroke-width="1.6"/><text x="1248" y="1217" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="760" fill="#6E56C2">ARQUITETURA DE SISTEMA</text><text x="1088" y="1261" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="830" fill="#6E56C2">AGENTES</text><text x="1088" y="1290" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243B56">Sistemas Agênticos</text><text x="1088" y="1326" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">Combinam objetivos,</text><text x="1088" y="1349" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">decisões, ferramentas,</text><text x="1088" y="1372" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#455F76">estado e verificação.</text><rect x="1081" y="1384" width="349" height="27" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="1090" y="1404" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="610" fill="#6E56C2">Ex.: fluxo com APIs e testes</text><text x="840" y="1458" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#557086">Escolha a abordagem pelo problema, pelas evidências e pelos riscos — não por uma suposta evolução linear.</text></svg>
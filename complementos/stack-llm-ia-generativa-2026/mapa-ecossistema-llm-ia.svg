<text x="757" y="1555" fill="#503a32" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400"><tspan x="757" dy="0">RAG pode funcionar sem banco vetorial dedicado.</tspan></text>
<circle cx="737" cy="1589" r="7" fill="#c45b39"/>
<text x="757" y="1597" fill="#503a32" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400"><tspan x="757" dy="0">Faltam segurança, custos, testes e governança.</tspan></text>
<text x="700" y="1708" text-anchor="middle" font-size="30" font-weight="750" font-family="Arial" fill="#184c53">Aprenda o básico → construa → teste → meça → verifique</text>

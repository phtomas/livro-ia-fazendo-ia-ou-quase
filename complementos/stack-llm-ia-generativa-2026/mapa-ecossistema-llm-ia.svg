<text x="113" y="1597" fill="#203c3c" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400"><tspan x="113" dy="0">Ajuda a encontrar o tipo de ferramenta</tspan><tspan x="113" dy="22">necessário.</tspan></text>
<text x="729" y="1462" font-family="Georgia,serif" font-size="34" fill="#ac492d">O que precisa de cuidado</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 1270" width="1510" height="1270" role="img" aria-labelledby="ttl dsc"><title id="ttl">30 estratégias simples para conversar melhor com modelos de linguagem</title><desc id="dsc">Infográfico em seis grupos: definir o problema, procurar evidências, pedir uma entrega útil, comparar alternativas, revisar sem destruir e fazer funcionar. Não são prompts mágicos e não dependem de marca específica.</desc><rect width="1510" height="1270" fill="#f8fafc"/><rect width="1510" height="11" fill="#225578"/><text x="47" y="76" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="800" fill="#152c45">30 ESTRATÉGIAS SIMPLES PARA LLMs</text><text x="47" y="122" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#5a6d80">Ideias de prompts para quem está começando — não são comandos mágicos</text><rect x="45" y="147" width="1420" height="60" rx="18" fill="#e7f6f1" stroke="#a5d4c6"/><text x="73" y="184" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#165c4b">Podem ser adaptadas a GPT, Claude, Gemini, Llama, Qwen e outros modelos que seguem instruções.</text><rect x="45" y="231" width="451" height="424" rx="18" fill="#fff" stroke="#2268a7" stroke-width="2"/><rect x="46" y="232" width="449" height="106" rx="18" fill="#ebf4ff"/><text x="66" y="270" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#2268a7">01 · Defina o problema</text><text x="66" y="307" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="510" fill="#455f76">Contexto, objetivo e informações disponíveis</text><circle cx="78" cy="366" r="16" fill="#2268a7"/><text x="78" y="372" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">1</text><text x="107" y="373" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Declare o resultado</text><line x1="63" y1="391" x2="478" y2="391" stroke="#e5e9ed" stroke-width="1"/><circle cx="78" cy="420" r="16" fill="#2268a7"/><text x="78" y="426" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">2</text><text x="107" y="427" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Pergunte só o necessário</text><line x1="63" y1="445" x2="478" y2="445" stroke="#e5e9ed" stroke-width="1"/><circle cx="78" cy="474" r="16" fill="#2268a7"/><text x="78" y="480" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">3</text><text x="107" y="481" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Identifique a lacuna</text><line x1="63" y1="499" x2="478" y2="499" stroke="#e5e9ed" stroke-width="1"/><circle cx="78" cy="528" r="16" fill="#2268a7"/><text x="78" y="534" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">4</text><text x="107" y="535" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Separe fatos e hipóteses</text><line x1="63" y1="553" x2="478" y2="553" stroke="#e5e9ed" stroke-width="1"/><circle cx="78" cy="582" r="16" fill="#2268a7"/><text x="78" y="588" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">5</text><text x="107" y="589" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Delimite as fontes</text><rect x="525" y="231" width="451" height="424" rx="18" fill="#fff" stroke="#0f8876" stroke-width="2"/><rect x="526" y="232" width="449" height="106" rx="18" fill="#eaf9f4"/><text x="546" y="270" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#0f8876">02 · Procure evidências</text><text x="546" y="307" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="510" fill="#455f76">Fundamentação, limites e critérios de prova</text><circle cx="558" cy="366" r="16" fill="#0f8876"/><text x="558" y="372" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">6</text><text x="587" y="373" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Localize a evidência</text><line x1="543" y1="391" x2="958" y2="391" stroke="#e5e9ed" stroke-width="1"/><circle cx="558" cy="420" r="16" fill="#0f8876"/><text x="558" y="426" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">7</text><text x="587" y="427" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Permita a incerteza</text><line x1="543" y1="445" x2="958" y2="445" stroke="#e5e9ed" stroke-width="1"/><circle cx="558" cy="474" r="16" fill="#0f8876"/><text x="558" y="480" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">8</text><text x="587" y="481" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Confirme a atualidade</text><line x1="543" y1="499" x2="958" y2="499" stroke="#e5e9ed" stroke-width="1"/><circle cx="558" cy="528" r="16" fill="#0f8876"/><text x="558" y="534" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">9</text><text x="587" y="535" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Exemplifique sem inventar</text><line x1="543" y1="553" x2="958" y2="553" stroke="#e5e9ed" stroke-width="1"/><circle cx="558" cy="582" r="16" fill="#0f8876"/><text x="558" y="588" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">10</text><text x="587" y="589" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Defina um teste</text><rect x="1005" y="231" width="451" height="424" rx="18" fill="#fff" stroke="#ad6b19" stroke-width="2"/><rect x="1006" y="232" width="449" height="106" rx="18" fill="#fff5e6"/><text x="1026" y="270" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#ad6b19">03 · Peça uma entrega útil</text><text x="1026" y="307" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="510" fill="#455f76">Clareza, ações e formato</text><circle cx="1038" cy="366" r="16" fill="#ad6b19"/><text x="1038" y="372" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">11</text><text x="1067" y="373" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Comece pela conclusão</text><line x1="1023" y1="391" x2="1438" y2="391" stroke="#e5e9ed" stroke-width="1"/><circle cx="1038" cy="420" r="16" fill="#ad6b19"/><text x="1038" y="426" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">12</text><text x="1067" y="427" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Troque conselho por ação</text><line x1="1023" y1="445" x2="1438" y2="445" stroke="#e5e9ed" stroke-width="1"/><circle cx="1038" cy="474" r="16" fill="#ad6b19"/><text x="1038" y="480" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">13</text><text x="1067" y="481" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Entregue texto copiável</text><line x1="1023" y1="499" x2="1438" y2="499" stroke="#e5e9ed" stroke-width="1"/><circle cx="1038" cy="528" r="16" fill="#ad6b19"/><text x="1038" y="534" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">14</text><text x="1067" y="535" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Mostre o resultado desejado</text><line x1="1023" y1="553" x2="1438" y2="553" stroke="#e5e9ed" stroke-width="1"/><circle cx="1038" cy="582" r="16" fill="#ad6b19"/><text x="1038" y="588" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">15</text><text x="1067" y="589" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Respeite um formato</text><rect x="45" y="675" width="451" height="424" rx="18" fill="#fff" stroke="#7c55b6" stroke-width="2"/><rect x="46" y="676" width="449" height="106" rx="18" fill="#f4effc"/><text x="66" y="714" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#7c55b6">04 · Compare alternativas</text><text x="66" y="751" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="510" fill="#455f76">Opções, critérios e riscos</text><circle cx="78" cy="810" r="16" fill="#7c55b6"/><text x="78" y="816" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">16</text><text x="107" y="817" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Compare caminhos diferentes</text><line x1="63" y1="835" x2="478" y2="835" stroke="#e5e9ed" stroke-width="1"/><circle cx="78" cy="864" r="16" fill="#7c55b6"/><text x="78" y="870" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">17</text><text x="107" y="871" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Recomende e justifique</text><line x1="63" y1="889" x2="478" y2="889" stroke="#e5e9ed" stroke-width="1"/><circle cx="78" cy="918" r="16" fill="#7c55b6"/><text x="78" y="924" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">18</text><text x="107" y="925" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Priorize impacto e esforço</text><line x1="63" y1="943" x2="478" y2="943" stroke="#e5e9ed" stroke-width="1"/><circle cx="78" cy="972" r="16" fill="#7c55b6"/><text x="78" y="978" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">19</text><text x="107" y="979" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Antecipe falhas</text><line x1="63" y1="997" x2="478" y2="997" stroke="#e5e9ed" stroke-width="1"/><circle cx="78" cy="1026" r="16" fill="#7c55b6"/><text x="78" y="1032" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">20</text><text x="107" y="1033" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Analise como especialista</text><rect x="525" y="675" width="451" height="424" rx="18" fill="#fff" stroke="#b84865" stroke-width="2"/><rect x="526" y="676" width="449" height="106" rx="18" fill="#fff0f4"/><text x="546" y="714" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#b84865">05 · Revise sem destruir</text><text x="546" y="751" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="510" fill="#455f76">Crítica e melhoria responsável</text><circle cx="558" cy="810" r="16" fill="#b84865"/><text x="558" y="816" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">21</text><text x="587" y="817" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Construa o contra-argumento</text><line x1="543" y1="835" x2="958" y2="835" stroke="#e5e9ed" stroke-width="1"/><circle cx="558" cy="864" r="16" fill="#b84865"/><text x="558" y="870" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">22</text><text x="587" y="871" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Encontre o elo fraco</text><line x1="543" y1="889" x2="958" y2="889" stroke="#e5e9ed" stroke-width="1"/><circle cx="558" cy="918" r="16" fill="#b84865"/><text x="558" y="924" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">23</text><text x="587" y="925" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Diagnostique antes de editar</text><line x1="543" y1="943" x2="958" y2="943" stroke="#e5e9ed" stroke-width="1"/><circle cx="558" cy="972" r="16" fill="#b84865"/><text x="558" y="978" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">24</text><text x="587" y="979" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Preserve as partes boas</text><line x1="543" y1="997" x2="958" y2="997" stroke="#e5e9ed" stroke-width="1"/><circle cx="558" cy="1026" r="16" fill="#b84865"/><text x="558" y="1032" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">25</text><text x="587" y="1033" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Corte o texto genérico</text><rect x="1005" y="675" width="451" height="424" rx="18" fill="#fff" stroke="#247d90" stroke-width="2"/><rect x="1006" y="676" width="449" height="106" rx="18" fill="#e8f8fb"/><text x="1026" y="714" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#247d90">06 · Faça funcionar de verdade</text><text x="1026" y="751" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="510" fill="#455f76">Estilo, restrições e melhoria do pedido</text><circle cx="1038" cy="810" r="16" fill="#247d90"/><text x="1038" y="816" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">26</text><text x="1067" y="817" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Adote o estilo, não a cópia</text><line x1="1023" y1="835" x2="1438" y2="835" stroke="#e5e9ed" stroke-width="1"/><circle cx="1038" cy="864" r="16" fill="#247d90"/><text x="1038" y="870" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">27</text><text x="1067" y="871" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Trabalhe sob restrições</text><line x1="1023" y1="889" x2="1438" y2="889" stroke="#e5e9ed" stroke-width="1"/><circle cx="1038" cy="918" r="16" fill="#247d90"/><text x="1038" y="924" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">28</text><text x="1067" y="925" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Transforme em modelo</text><line x1="1023" y1="943" x2="1438" y2="943" stroke="#e5e9ed" stroke-width="1"/><circle cx="1038" cy="972" r="16" fill="#247d90"/><text x="1038" y="978" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">29</text><text x="1067" y="979" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Confira os requisitos</text><line x1="1023" y1="997" x2="1438" y2="997" stroke="#e5e9ed" stroke-width="1"/><circle cx="1038" cy="1026" r="16" fill="#247d90"/><text x="1038" y="1032" font-size="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff">30</text><text x="1067" y="1033" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#233e56">Melhore o próprio pedido</text><rect x="45" y="1138" width="1420" height="87" rx="18" fill="#fff4df" stroke="#e9c488"/><text x="72" y="1173" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#855c21">PROMPT BOM = objetivo + contexto + limites + formato + critério de conferência</text><text x="72" y="1205" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#855c21">Os resultados variam conforme o modelo e a informação disponível. Revise fatos e teste ações.</text></svg>
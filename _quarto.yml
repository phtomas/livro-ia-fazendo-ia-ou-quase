project:
  type: book
  output-dir: _book

lang: pt-BR
number-sections: true
number-depth: 2
toc-depth: 2
bibliography: references.bib
csl: estilo-referencias.csl
link-citations: true
filters:
  - filters/boxes.lua

book:
  title: "IA fazendo IA — ou quase"
  subtitle: "Agentes, skills e ferramentas: do livro ao jogo e ao hardware"
  author: "Autoria a confirmar"
  date: "2026-11-13"
  chapters:
    - index.qmd
    - chapters/01-um-livro-que-aprende.qmd
    - chapters/02-nomes-e-contratos.qmd
    - chapters/03-por-dentro-do-agente.qmd
    - chapters/04-quando-criar-um-agente.qmd
    - chapters/05-provas-custos-e-seguranca.qmd
    - chapters/06-a-voz-que-a-ferramenta-nao-deve-apagar.qmd
    - chapters/07-tres-portas-para-a-mesma-oficina.qmd
    - chapters/08-uma-skill-que-pode-viajar.qmd
    - chapters/09-o-fluxo-que-sabe-onde-parou.qmd
    - chapters/10-quem-deixa-o-agente-decidir.qmd
    - chapters/11-o-primeiro-ciclo-supervisionado.qmd
    - chapters/12-quando-uma-skill-merece-confianca.qmd
    - chapters/13-a-ferramenta-que-nao-precisa-de-opiniao.qmd
    - chapters/14-duas-copias-uma-historia.qmd
    - chapters/15-os-frameworks-nao-decidem-por-nos.qmd
    - chapters/16-medindo-a-oficina.qmd
    - chapters/17-a-editora-que-aprende-a-conferir.qmd
    - chapters/18-um-jogo-nao-e-jogavel-so-porque-compila.qmd
    - chapters/19-a-placa-nao-leu-nosso-relatorio.qmd
    - chapters/20-o-mesmo-metodo-tres-portas.qmd
    - chapters/21-o-livro-vivo-sem-perder-a-memoria.qmd
    - appendices/10-principios.qmd
    - appendices/glossario.qmd
    - references.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    css: styles.css
  epub:
    toc: true
    css: styles.css
  pdf:
    toc: true
    documentclass: scrreprt
    include-in-header: pdf-preambulo.tex

execute:
  freeze: auto
